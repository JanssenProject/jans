name: "Scan: Scorecard"
on:
  push:
    # Only the default branch is supported.
    branches:
    - main
  schedule:
    # Weekly on Saturdays.
    - cron: '30 1 * * 6'

permissions: read-all

jobs:
  # Separate job: publishing rejects runs whose scorecard job has run steps
  check-token:
    name: Check Scorecard PAT
    runs-on: ubuntu-latest
    if: github.repository == 'JanssenProject/jans'
    outputs:
      valid: ${{ steps.pat.outputs.valid }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Validate SCORECARD_TOKEN
        id: pat
        env:
          SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
        run: |
          if [ -n "$SCORECARD_TOKEN" ] && curl -sf -o /dev/null -H "Authorization: Bearer $SCORECARD_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SCORECARD_TOKEN missing or invalid; falling back to GITHUB_TOKEN"
          fi

  analysis:
    name: Scorecard analysis
    needs: check-token
    runs-on: ubuntu-latest
    if: github.repository == 'JanssenProject/jans'
    permissions:
      # Needed for Code scanning upload
      security-events: write
      # Needed for GitHub OIDC token if publish_results is true
      id-token: write
      # Required to check branch protection and other repo settings
      contents: read
      # Required to query the GitHub API for branch/action status
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # PAT needed to read classic branch protection
          repo_token: ${{ needs.check-token.outputs.valid == 'true' && secrets.SCORECARD_TOKEN || github.token }}
          # Publishes the score to the public OpenSSF Scorecard API.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: results.sarif
