name: Publish docs via GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'charts/**'
      - 'mkdocs.yml'
      - 'docker-jans-**/README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'charts/**'
      - 'mkdocs.yml'
      - 'docker-jans-**/README.md'
      - 'CHANGELOG.md'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g."v1.6.0")'
        default: "nightly"
        required: false
concurrency:
  group: run-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write  # keyless Cosign signing via Sigstore OIDC
      packages: read   # read GitHub Packages Maven for doc generation
    if: github.repository == 'JanssenProject/jans'
    name: Deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.MOAUTO_WORKFLOW_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          cp docs/pyproject.toml docs/poetry.lock ../
          poetry install --no-root
          cp mkdocs.yml CHANGELOG.md ../

      - name: Checkout jans ${{ github.event.inputs.version }}
        if: >-
          github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: '${{ github.event.inputs.version }}'
          fetch-depth: 0
          token: ${{ secrets.MOAUTO_WORKFLOW_TOKEN }}

      - name: Copy files from main to ${{ github.event.inputs.version }}
        if: >-
          github.event_name == 'workflow_dispatch'
        run: |
          mv ../mkdocs.yml mkdocs.yml
          cp ../CHANGELOG.md docs/CHANGELOG.md

      - name: Sync CHANGELOG to docs
        if: github.event_name != 'workflow_dispatch'
        run: |
          cp CHANGELOG.md docs/CHANGELOG.md

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Package and sign Helm charts with Cosign
        run: |
          helm package charts/janssen/
          helm package charts/janssen-all-in-one/
          for chart in janssen-*.tgz; do
            cosign sign-blob --yes --bundle "${chart}.sigstore.json" "$chart"
          done
          cp janssen-*.tgz janssen-*.tgz.sigstore.json ../

      - name: Configure Git
        run: |
          git config --global user.name "mo-auto"
          git config --global user.email "54212639+mo-auto@users.noreply.github.com"
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"
          # ff-only so a divergent branch fails cleanly (caught below) instead of
          # leaving merge-conflict markers in the tree.
          git config --global pull.ff only
          echo "${{ secrets.MOAUTO_WORKFLOW_TOKEN }}" | gh auth login --with-token

      - name: Wait for build-test to publish Maven artifacts
        if: >-
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          (!github.event.release.draft) &&
          (startsWith(github.event.release.name, 'v') || github.event.release.name == 'nightly')
        env:
          GH_TOKEN: ${{ secrets.MOAUTO_WORKFLOW_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # This same tag push also triggers build-test.yml, which re-deploys jans-bom
          # to GitHub Packages; generating before it finishes hits a 401 (absent).
          echo "Locating build-test run for ${HEAD_SHA}"
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list --workflow=build-test.yml -R "$GITHUB_REPOSITORY" \
              --event=push --commit "$HEAD_SHA" --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              echo "Found build-test run ${run_id}; waiting for it to finish."
              break
            fi
            echo "build-test run not visible yet (attempt ${i}/30); retrying in 30s."
            sleep 30
          done
          if [ -z "$run_id" ]; then
            echo "ERROR: no build-test run found for ${HEAD_SHA}; refusing to generate docs against unpublished artifacts." >&2
            exit 1
          fi
          gh run watch "$run_id" -R "$GITHUB_REPOSITORY" --exit-status

      - name: Generate docs
        if: >-
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          (!github.event.release.draft) &&
          (startsWith(github.event.release.name, 'v') || github.event.release.name == 'nightly')
        env:
          VERSION: ${{ github.event.release.tag_name }}
          # GitHub Packages auth for .github/maven-settings.xml (server id "github").
          JANS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
         mkdir temp && cd temp
         git clone  https://mo-auto:${{ secrets.MOAUTO_WORKFLOW_TOKEN }}@github.com/JanssenProject/jans.git
         cd jans
         git checkout -b cn-jans-update-auto-generated-docs
         git pull origin cn-jans-update-auto-generated-docs || echo "Nothing to pull"
         echo "Custom work on generating docs can go here."

         echo "Generating auto-generated docs and push to main"
         bash ./automation/docs/generate-autogenerated-docs.sh .
         cd docs
         git add . || echo "Nothing to add"
         git commit -a -S -m "docs: auto-generated property docs" || echo "Nothing to commit"
         cd ..

         echo "Add jans-config-api Swagger SPECs that are auto-generated via API annotations"
         bash ./automation/docs/generate-swagger-specs.sh . || echo "something went wrong with generating the swagger docs"
         cd jans-config-api/docs
         git add . || echo "Nothing to add"
         git commit -a -S -m "docs: auto-generated Swagger SPEC docs" || echo "Nothing to commit"
         cd ../..

         git push --set-upstream origin cn-jans-update-auto-generated-docs
         MESSAGE="fix(docs): autogenerate docs"
         BRANCH="cn-jans-update-auto-generated-docs"
         # Separate assignment so a gh pr list failure propagates under set -e.
         open_prs=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
         if [ "$open_prs" -gt 0 ]; then
           echo "Open PR already exists for ${BRANCH}; skipping creation."
         else
           gh pr create --base main --body "Auto generated docs" --title "${MESSAGE}"
         fi
         cd ../../

         sudo rm -rf temp

      - name: Use latest template overrides from main
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          git show origin/main:docs/overrides/main.html > docs/overrides/main.html

      - name: Enable Reo and Scarf tracking for versioned docs
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published')
        run: |
          sed -i 's/enable_scarf_pixel: false/enable_scarf_pixel: true/' mkdocs.yml
          sed -i 's/enable_reo_flag: false/enable_reo_flag: true/' mkdocs.yml
          echo "Tracking flags status:"
          grep -E 'enable_scarf_pixel|enable_reo_flag' mkdocs.yml

      - name: mike deploy ${{ github.event.inputs.version }}
        if: >-
          github.event_name == 'workflow_dispatch'
        run: |
          poetry run mike deploy --push --update-aliases ${{ github.event.inputs.version }}

      - name: mike deploy head
        if: contains(github.ref, 'refs/heads/main') && github.event_name != 'workflow_dispatch'
        run: |
          poetry run mike deploy --push head

      - name: mike deploy new version
        if: >-
          github.event_name == 'release' &&
          github.event.action == 'published' &&
          (!github.event.release.draft) &&
          (startsWith(github.event.release.name, 'v') || github.event.release.name == 'nightly')
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          poetry run mike deploy --push "$VERSION"

      - name: Update mike version aliases
        id: set_versions
        run: |
          GITHUB_EVENT_RELEASE_TAG_NAME="${{ github.event.release.tag_name }}"
          TAGS=$(gh release list -L 1000 -R ${{ github.repository }} | grep -o '^\v.*'| grep -v Draft | cut -f 1 | sed '/-/!{s/$/_/}' | sort -V | sed 's/_$//')
          LATEST=$(echo "${TAGS}" | tail -1)
          STABLE=$(echo "${TAGS}" | grep -v -- "nightly" | tail -1)
          if [[ "$GITHUB_EVENT_RELEASE_TAG_NAME" == 'nightly' ]]; then
            LATEST='nightly'
          fi
          echo "Latest is $LATEST and Stable is $STABLE"
          poetry run mike alias -u head main
          poetry run mike alias -u "${STABLE}" stable
          poetry run mike set-default --push stable
          echo "LATEST=${LATEST}" >> $GITHUB_OUTPUT
          echo "STABLE=${STABLE}" >> $GITHUB_OUTPUT

      - name: Create version files
        run: |
          LATEST=${{ steps.set_versions.outputs.LATEST }}
          STABLE=${{ steps.set_versions.outputs.STABLE }}
          git checkout -f gh-pages
          git pull origin gh-pages
          mv ../janssen-*.tgz ../janssen-*.tgz.sigstore.json ./charts/
          cd ./charts
          git add janssen-*.tgz janssen-*.tgz.sigstore.json && git update-index --refresh
          helm repo index .
          git add index.yaml && git update-index --refresh
          cd ..
          for folder in v*/; do
            cp -r nightly/search "$folder"
            git add $folder/search && git update-index --refresh
          done
          cd ${LATEST}
          if [[ "${LATEST}" == "nightly" ]]; then
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/replace-janssen-version-stable/0.0.0-nightly/g"
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/replace-janssen-version/0.0.0-nightly/g"
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/v0.0.0-nightly/nightly/g"
          else
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/replace-janssen-version/${LATEST:1}/g"
          fi
          git add . && git update-index --refresh
          cd ..
          for folder in */; do
            if [[ $folder != "${STABLE}/" ]]; then
              git rm -r $folder/admin/reference/javadocs || echo "Nothing to remove"
            fi
          done
          git diff-index --quiet HEAD -- || git commit -S -m "docs: update version references"
          echo "${STABLE}" > stable.txt
          git add stable.txt && git update-index --refresh
          git diff-index --quiet HEAD -- || git commit -S -m "Set stable to ${STABLE}"
          echo "${LATEST}" > latest.txt
          git add latest.txt && git update-index --refresh
          git diff-index --quiet HEAD -- || git commit -S -m "Set latest to ${LATEST}"
          git push origin gh-pages
