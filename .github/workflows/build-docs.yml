name: "Build: Docs"
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docker-jans-**/README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docker-jans-**/README.md'
      - 'CHANGELOG.md'
  workflow_run:
    workflows: ["Build: Publish"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g."v1.6.0")'
        default: "nightly"
        required: false
concurrency:
  group: run-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write  # keyless Cosign signing via Sigstore OIDC
      packages: read   # read GitHub Packages Maven for doc generation
    if: >-
      github.repository == 'JanssenProject/jans' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (startsWith(github.event.workflow_run.head_branch, 'v') ||
         github.event.workflow_run.head_branch == 'nightly')))
    name: Deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.MOAUTO_WORKFLOW_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          cp docs/pyproject.toml docs/poetry.lock ../
          poetry install --no-root
          cp mkdocs.yml CHANGELOG.md ../
          cp -r automation/docs ../automation-docs

      - name: Checkout jans ${{ github.event.inputs.version }}
        if: >-
          github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: '${{ github.event.inputs.version }}'
          fetch-depth: 0
          token: ${{ secrets.MOAUTO_WORKFLOW_TOKEN }}

      - name: Copy files from main to ${{ github.event.inputs.version }}
        if: >-
          github.event_name == 'workflow_dispatch'
        run: |
          mv ../mkdocs.yml mkdocs.yml
          cp ../CHANGELOG.md docs/CHANGELOG.md
          rm -rf automation/docs
          mkdir -p automation
          mv ../automation-docs automation/docs

      - name: Sync CHANGELOG to docs
        if: github.event_name != 'workflow_dispatch'
        run: |
          cp CHANGELOG.md docs/CHANGELOG.md

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Configure Git
        run: |
          git config --global user.name "mo-auto"
          git config --global user.email "54212639+mo-auto@users.noreply.github.com"
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"
          # Keep pulls fast-forward-only (e.g. gh-pages) so they never open a merge.
          git config --global pull.ff only
          echo "${{ secrets.MOAUTO_WORKFLOW_TOKEN }}" | gh auth login --with-token

      - name: Check release is published
        id: release
        if: github.event_name == 'workflow_run'
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' || echo missing)
          [ "$draft" = "false" ] || echo "::warning::Release ${TAG} not published (draft=${draft}); release docs skipped."
          echo "published=$([ "$draft" = "false" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Generate docs
        if: steps.release.outputs.published == 'true'
        env:
          # GitHub Packages auth for .github/maven-settings.xml (server id "github").
          JANS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
         mkdir temp && cd temp
         git clone  https://mo-auto:${{ secrets.MOAUTO_WORKFLOW_TOKEN }}@github.com/JanssenProject/jans.git
         cd jans
         git checkout -b cn-jans-update-auto-generated-docs

         echo "Generating auto-generated docs and push to main"
         bash ./automation/docs/generate-autogenerated-docs.sh .
         cd docs
         git add . || echo "Nothing to add"
         git commit -a -S -m "docs: auto-generated property docs" || echo "Nothing to commit"
         cd ..

         echo "Add jans-config-api Swagger SPECs that are auto-generated via API annotations"
         bash ./automation/docs/generate-swagger-specs.sh . || echo "something went wrong with generating the swagger docs"
         cd jans-config-api/docs
         git add . || echo "Nothing to add"
         git commit -a -S -m "docs: auto-generated Swagger SPEC docs" || echo "Nothing to commit"
         cd ../..

         # Branch is regenerated from main each run, so overwrite any stale remote tip.
         git push --force --set-upstream origin cn-jans-update-auto-generated-docs
         MESSAGE="fix(docs): autogenerate docs"
         BRANCH="cn-jans-update-auto-generated-docs"
         # Separate assignment so a gh pr list failure propagates under set -e.
         open_prs=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
         if [ "$open_prs" -gt 0 ]; then
           echo "Open PR already exists for ${BRANCH}; skipping creation."
         else
           gh pr create --base main --body "Auto generated docs" --title "${MESSAGE}"
         fi
         cd ../../

         sudo rm -rf temp

      - name: Use latest template overrides from main
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.published == 'true'
        run: |
          git show origin/main:docs/overrides/main.html > docs/overrides/main.html

      - name: Enable Reo and Scarf tracking for versioned docs
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.published == 'true'
        run: |
          sed -i 's/enable_scarf_pixel: false/enable_scarf_pixel: true/' mkdocs.yml
          sed -i 's/enable_reo_flag: false/enable_reo_flag: true/' mkdocs.yml
          echo "Tracking flags status:"
          grep -E 'enable_scarf_pixel|enable_reo_flag' mkdocs.yml

      - name: Resolve publish target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_PUBLISHABLE: ${{ steps.release.outputs.published == 'true' }}
        run: |
          publish=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              version="$INPUT_VERSION"
              publish=true
              ;;
            workflow_run)
              version="$RELEASE_TAG"
              publish="$RELEASE_PUBLISHABLE"
              ;;
            push)
              version="head"
              publish=true
              ;;
            *)
              version="head"
              ;;
          esac
          echo "Version ${version}, publish ${publish}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Build docs
        env:
          MIKE_DOCS_VERSION: ${{ steps.target.outputs.version }}
        run: |
          poetry run python automation/docs/stamp-git-dates.py
          poetry run zensical build -f mkdocs.yml
          poetry run python automation/docs/generate-llms-txt.py

      - name: Publish ${{ steps.target.outputs.version }} to gh-pages
        if: steps.target.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          aliases=()
          if [ "$VERSION" = "head" ]; then
            aliases=(main)
          fi
          poetry run python automation/docs/publish-docs.py --push deploy "$VERSION" "${aliases[@]}"

      - name: Update version aliases
        id: set_versions
        if: steps.target.outputs.publish == 'true'
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          TAGS=$(gh release list -L 1000 -R ${{ github.repository }} | grep -o '^\v.*'| grep -v Draft | cut -f 1 | sed '/-/!{s/$/_/}' | sort -V | sed 's/_$//')
          LATEST=$(echo "${TAGS}" | tail -1)
          STABLE=$(echo "${TAGS}" | grep -v -- "nightly" | tail -1)
          if [[ "$GITHUB_EVENT_RELEASE_TAG_NAME" == 'nightly' ]]; then
            LATEST='nightly'
          fi
          echo "Latest is $LATEST and Stable is $STABLE"
          poetry run python automation/docs/publish-docs.py --push alias "${STABLE}" stable
          poetry run python automation/docs/publish-docs.py --push set-default stable
          echo "LATEST=${LATEST}" >> $GITHUB_OUTPUT
          echo "STABLE=${STABLE}" >> $GITHUB_OUTPUT

      - name: Retire documentation past the retention window
        if: steps.target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.MOAUTO2_WORKFLOW_TOKEN || secrets.MOAUTO_WORKFLOW_TOKEN }}
        run: |
          poetry run python automation/docs/publish-docs.py prune \
            --keep-releases 4 --keep v1.16.0 --archive-dir ../docs-archives
          bash automation/docs/archive-version.sh ../docs-archives
          poetry run python automation/docs/publish-docs.py --push prune \
            --keep-releases 4 --keep v1.16.0 --archive-dir ../docs-archives

      - name: Create version files
        if: steps.target.outputs.publish == 'true'
        run: |
          LATEST=${{ steps.set_versions.outputs.LATEST }}
          STABLE=${{ steps.set_versions.outputs.STABLE }}
          git checkout -f gh-pages
          git pull origin gh-pages
          cd ${LATEST}
          if [[ "${LATEST}" == "nightly" ]]; then
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/replace-janssen-version-stable/0.0.0-nightly/g"
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/replace-janssen-version/0.0.0-nightly/g"
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/v0.0.0-nightly/nightly/g"
          else
           egrep -lRZ --exclude=CONTRIBUTING.md . | xargs -0 -l sed -i -e "s/replace-janssen-version/${LATEST:1}/g"
          fi
          git add . && git update-index --refresh
          cd ..
          for folder in */; do
            if [[ $folder != "${STABLE}/" ]]; then
              git rm -r $folder/admin/reference/javadocs || echo "Nothing to remove"
            fi
          done
          git diff-index --quiet HEAD -- || git commit -S -m "docs: update version references"
          echo "${STABLE}" > stable.txt
          git add stable.txt && git update-index --refresh
          git diff-index --quiet HEAD -- || git commit -S -m "Set stable to ${STABLE}"
          echo "${LATEST}" > latest.txt
          git add latest.txt && git update-index --refresh
          git diff-index --quiet HEAD -- || git commit -S -m "Set latest to ${LATEST}"
          git push origin gh-pages
