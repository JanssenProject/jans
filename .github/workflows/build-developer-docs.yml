name: "Build: Developer docs"
on:
  workflow_run:
    workflows: ["Build: Publish"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to document (e.g. "v1.6.0")'
        required: true
      dry_run:
        description: 'Generate everything but skip the push to developer-docs'
        type: boolean
        default: true
concurrency:
  group: developer-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_VERSION: 3.9.16

jobs:
  resolve:
    if: >-
      github.repository == 'JanssenProject/jans' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      publish: ${{ steps.release.outputs.publish }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$DRY_RUN_INPUT" != "true" ] &&
             [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: publishing runs must be dispatched from main; dispatch with dry_run to test a branch." >&2
            exit 1
          fi
          case "$REQUESTED_TAG" in
            v[0-9]*) ;;
            *)
              echo "ERROR: '${REQUESTED_TAG}' is not a v* release tag." >&2
              exit 1
              ;;
          esac
          if [ "$(gh release view "$REQUESTED_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "ERROR: '${REQUESTED_TAG}' is not a published release." >&2
            exit 1
          fi
          # Pin one commit so every job documents the same tree, even if the branch moves.
          sha="${RUN_SHA:-}"
          if [ -z "$sha" ] && [ "$DRY_RUN_INPUT" != "true" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REQUESTED_TAG}" --jq '.sha')
          fi
          sha="${sha:-$GITHUB_SHA}"
          publish=true
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            publish=false
          fi
          echo "Documenting ${REQUESTED_TAG} from ${sha} (publish: ${publish})"
          echo "tag=${REQUESTED_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  # Each generator writes <slug>/ under docs-out; publish merges the artifacts back.
  generate-rust:
    needs: resolve
    name: Generate Rust docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate rustdocs
        run: bash automation/docs/generate-rustdocs.sh . "$RUNNER_TEMP/docs-out/cedarling"

      - name: Upload docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cedarling-rust-docs
          path: ${{ runner.temp }}/docs-out
          if-no-files-found: error
          retention-days: 1

  generate-python:
    needs: resolve
    name: Generate Python docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate python docs
        run: bash automation/docs/generate-python-docs.sh . "$RUNNER_TEMP/docs-out/cedarling-python"

      - name: Upload docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cedarling-python-docs
          path: ${{ runner.temp }}/docs-out
          if-no-files-found: error
          retention-days: 1

  generate-java:
    needs: resolve
    name: Generate Java docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        env:
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail
          tarball="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/${tarball}"
          echo "${MAVEN_SHA512}  ${RUNNER_TEMP}/${tarball}" | sha512sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # Also emits the non-cedarling module javadocs, so it fills the docs-out root.
      - name: Generate javadocs
        env:
          JANS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: bash automation/docs/generate-javadocs.sh . "$RUNNER_TEMP/docs-out" "$RELEASE_TAG"

      - name: Upload docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cedarling-java-docs
          path: ${{ runner.temp }}/docs-out
          if-no-files-found: error
          retention-days: 1

  generate-c:
    needs: resolve
    name: Generate C docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Install protobuf compiler and doxygen
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler doxygen

      - name: Generate C docs
        run: bash automation/docs/generate-c-docs.sh . "$RUNNER_TEMP/docs-out/cedarling-c"

      - name: Upload docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cedarling-c-docs
          path: ${{ runner.temp }}/docs-out
          if-no-files-found: error
          retention-days: 1

  generate-go:
    needs: resolve
    name: Generate Go docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23"
          cache: false

      - name: Generate go docs
        run: bash automation/docs/generate-go-docs.sh . "$RUNNER_TEMP/docs-out/cedarling-go"

      - name: Upload docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cedarling-go-docs
          path: ${{ runner.temp }}/docs-out
          if-no-files-found: error
          retention-days: 1

  generate-js:
    needs: resolve
    name: Generate JS/TS docs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: jans-cedarling/bindings/cedarling_wasm/js/package-lock.json

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate JS/TS docs
        run: bash automation/docs/generate-js-docs.sh . "$RUNNER_TEMP/docs-out/cedarling-js"

      - name: Upload docs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cedarling-js-docs
          path: ${{ runner.temp }}/docs-out
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, generate-rust, generate-python, generate-java, generate-c, generate-go, generate-js]
    name: Publish API references
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Set output directory
        run: echo "GENERATED_DIR=${RUNNER_TEMP}/developer-docs-out" >> "$GITHUB_ENV"

      - name: Checkout ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Download generated docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cedarling-*-docs
          path: ${{ env.GENERATED_DIR }}
          merge-multiple: true

      - name: Import GPG key
        id: import_gpg
        if: ${{ needs.resolve.outputs.publish == 'true' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config --global user.name "mo-auto"
          git config --global user.email "54212639+mo-auto@users.noreply.github.com"
          if [ -n "${{ steps.import_gpg.outputs.keyid }}" ]; then
            git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"
          fi

      - name: Publish to developer-docs
        env:
          DEVELOPER_DOCS_TOKEN: ${{ needs.resolve.outputs.publish == 'true' && secrets.MOAUTO_WORKFLOW_TOKEN || '' }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          DRY_RUN: ${{ needs.resolve.outputs.publish == 'true' && '0' || '1' }}
          DOCS_SIGN_COMMITS: ${{ needs.resolve.outputs.publish == 'true' && '1' || '0' }}
          EXPECTED_SECTIONS: cedarling cedarling-python cedarling-java cedarling-c cedarling-go cedarling-js
        run: bash automation/docs/publish-developer-docs.sh "$GENERATED_DIR" "$RELEASE_TAG"
