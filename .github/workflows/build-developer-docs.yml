name: "Build: Developer docs"
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to document (e.g. "v1.6.0")'
        required: true
concurrency:
  group: developer-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'JanssenProject/jans' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.action == 'published' &&
        (!github.event.release.draft) &&
        startsWith(github.event.release.tag_name, 'v')))
    name: Publish API references
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout ${{ github.event.inputs.version || github.event.release.tag_name }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.version || github.event.release.tag_name }}
          token: ${{ secrets.MOAUTO_WORKFLOW_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Set up Python 3.10
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MOAUTO_GPG_PRIVATE_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config --global user.name "mo-auto"
          git config --global user.email "54212639+mo-auto@users.noreply.github.com"
          git config --global user.signingkey "${{ steps.import_gpg.outputs.keyid }}"

      - name: Generate and publish developer docs
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.event.release.tag_name }}
          DEVELOPER_DOCS_URL: https://mo-auto:${{ secrets.MOAUTO_WORKFLOW_TOKEN }}@github.com/JanssenProject/developer-docs.git
          JANS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash automation/docs/publish-developer-docs.sh . "$RELEASE_TAG"
