paths:
  /.well-known/lock-server-configuration:
    get:
      description: Request .well-know Lock server configuration
      operationId: doGet
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Ok
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
          description: InternalServerError
      summary: Request .well-known data
      tags:
      - Lock - Server Configuration
  /api/v1/audit/health:
    post:
      description: Save health data
      operationId: processHealthRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthEntry"
        description: Health entry
      responses:
        "200":
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
          description: Bad Request
        "401":
          description: "Missing, expired, revoked or invalid access token"
          headers:
            WWW-Authenticate:
              description: Bearer challenge; error="invalid_token" when a token was
                sent
              schema:
                type: string
              style: simple
        "403":
          description: Access token lacks a required scope
          headers:
            WWW-Authenticate:
              description: Bearer challenge with error="insufficient_scope"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/lock/health.write
      summary: Save health data
      tags:
      - Lock - Audit Health
  /api/v1/audit/health/bulk:
