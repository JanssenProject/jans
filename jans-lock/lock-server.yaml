  /api/v1/audit/trace:
    post:
      description: Verify and ingest a single signed TRACE assertion
      operationId: submitRecord
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: TRACE assertion
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceAcceptanceResponse"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Bad Request
        "401":
          description: "Missing, expired, revoked or invalid access token"
          headers:
            WWW-Authenticate:
              description: Bearer challenge; error="invalid_token" when a token was
                sent
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: "Access token lacks a required scope (WWW-Authenticate: Bearer\
            \ error=\"insufficient_scope\"), or the request is not allowed for the\
            \ client"
          headers:
            WWW-Authenticate:
              description: Bearer challenge with error="insufficient_scope"
              schema:
                type: string
              style: simple
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.write
      summary: Submit a TRACE evidence record
      tags:
      - Lock - Audit Trace
  /api/v1/audit/trace/admin/producer-chains:
