      - oauth2:
        - https://jans.io/oauth/lock/trace.write
      summary: Submit a batch of TRACE evidence records
      tags:
      - Lock - Audit Trace
  /api/v1/audit/trace/executions/{trace_execution_id}:
    get:
      description: "All direct records of an execution, ordered by receipt sequence"
      operationId: getExecution
      parameters:
      - in: path
        name: trace_execution_id
        required: true
        schema:
          type: string
      - description: Disambiguate a bare trace_execution_id used by more than one
          authority
        in: query
        name: execution_authority
        schema:
          type: string
      - description: Paging offset
        in: query
        name: start
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Paging size, 1-1000"
        in: query
        name: count
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceExecutionResponse"
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Bad Request
        "401":
          description: "Missing, expired, revoked or invalid access token"
          headers:
            WWW-Authenticate:
              description: Bearer challenge; error="invalid_token" when a token was
                sent
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: "Access token lacks a required scope (WWW-Authenticate: Bearer\
            \ error=\"insufficient_scope\"), or the request is not allowed for the\
            \ client"
          headers:
            WWW-Authenticate:
              description: Bearer challenge with error="insufficient_scope"
              schema:
                type: string
              style: simple
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.readonly
      summary: Retrieve one TRACE execution
      tags:
      - Lock - Audit Trace
  /api/v1/audit/trace/records:
    get:
      description: "Records whose trace.policy names the given policy store id, version\
        \ or bundle hash, optionally within a receipt time range, ordered by receipt\
        \ sequence"
      operationId: searchRecords
      parameters:
      - description: trace.policy.policy_store_id to match
        in: query
        name: policy_store_id
        schema:
          type: string
      - description: trace.policy.policy_store_version to match
        in: query
        name: policy_store_version
        schema:
          type: string
      - description: trace.policy.bundle_hash to match
        in: query
        name: bundle_hash
        schema:
          type: string
      - description: "Earliest received_at, RFC 3339, inclusive"
        in: query
        name: received_from
        schema:
          type: string
      - description: "Latest received_at, RFC 3339, inclusive"
        in: query
        name: received_to
        schema:
          type: string
      - description: Paging offset
        in: query
        name: start
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Paging size, 1-1000"
        in: query
        name: count
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceRecordSearchResponse"
          description: Ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Bad Request
        "401":
          description: "Missing, expired, revoked or invalid access token"
          headers:
            WWW-Authenticate:
              description: Bearer challenge; error="invalid_token" when a token was
                sent
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: "Access token lacks a required scope (WWW-Authenticate: Bearer\
            \ error=\"insufficient_scope\"), or the request is not allowed for the\
            \ client"
          headers:
            WWW-Authenticate:
              description: Bearer challenge with error="insufficient_scope"
              schema:
                type: string
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.readonly
      summary: Search TRACE records by policy store release
      tags:
      - Lock - Audit Trace
  /api/v1/audit/trace/records/{record_id}:
    get:
      description: Domain-scoped retrieval of a stored envelope by record identity
      operationId: getRecord
      parameters:
      - in: path
        name: record_id
        required: true
        schema:
          type: string
      - description: Disambiguate a bare record_id used by more than one producer
        in: query
        name: producer_id
        schema:
          type: string
      responses:
        "200":
          content:
