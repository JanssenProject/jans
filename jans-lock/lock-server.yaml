  /api/v1/audit/trace/bulk:
    post:
      description: "Verify and ingest a JSON array of signed TRACE assertions, continuing\
        \ past per-item failures. One producer per batch"
      operationId: submitBulkRecords
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
        description: JSON array of TRACE assertions
      responses:
        "207":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceBulkIngestionResponse"
          description: Multi-Status (per-item outcomes in the body)
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
          description: Bad Request
        "401":
          description: "Missing, expired, revoked or invalid access token"
          headers:
            WWW-Authenticate:
              description: Bearer challenge; error="invalid_token" when a token was
                sent
              schema:
                type: string
              style: simple
        "403":
          content:
