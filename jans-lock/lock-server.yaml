openapi: 3.0.1
info:
  title: Jans Lock API
  contact:
    name: Contact
    url: https://github.com/JanssenProject/jans/discussions
  license:
    name: License
    url: https://github.com/JanssenProject/jans/blob/main/LICENSE
  version: OAS Version
servers:
- url: https://jans.local.io
  description: The Jans server
tags:
- name: Lock - Server Configuration
- name: Lock - Stat
- name: Lock - Audit Health
- name: Lock - Audit Log
- name: Lock - Audit Telemetry
- name: Lock - Audit Trace
- name: Lock - Audit Trace Admin
paths:
  /api/v1/configuration:
    get:
      tags:
      - Lock - Server Configuration
      summary: Request .well-known data
      description: Request .well-know Lock server configuration
      operationId: getConfiguration
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
  /.well-known/lock-server-configuration:
    get:
      tags:
      - Lock - Server Configuration
      summary: Request .well-known data
      description: Request .well-know Lock server configuration
      operationId: doGet
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: string
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
  /api/v1/audit/health/bulk:
    post:
      tags:
      - Lock - Audit Health
      summary: Bulk save health data
      description: Bulk save health data
      operationId: processBulkHealthRequest
      requestBody:
        description: Bulk health entry
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/HealthEntry"
      responses:
        "200":
          description: Ok
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/health.write
  /api/v1/audit/log/bulk:
    post:
      tags:
      - Lock - Audit Log
      summary: Bulk save log data
      description: Bulk save log data
      operationId: processBulkLogRequest
      requestBody:
        description: Bulk log entry
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/LogEntry"
      responses:
        "200":
          description: Ok
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/log.write
  /api/v1/audit/telemetry/bulk:
    post:
      tags:
      - Lock - Audit Telemetry
      summary: Bulk save telemetry data
      description: Bulk save telemetry data
      operationId: processBulkTelemetryRequest
      requestBody:
        description: Bulk telemetry entry
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TelemetryEntry"
      responses:
        "200":
          description: Ok
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/telemetry.write
  /api/v1/audit/health:
    post:
      tags:
      - Lock - Audit Health
      summary: Save health data
      description: Save health data
      operationId: processHealthRequest
      requestBody:
        description: Health entry
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthEntry"
      responses:
        "200":
          description: Ok
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/health.write
  /api/v1/audit/log:
    post:
      tags:
      - Lock - Audit Log
      summary: Save log data
      description: Save log data
      operationId: processLogRequest
      requestBody:
        description: Log entry
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntry"
      responses:
        "200":
          description: Ok
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/log.write
  /api/v1/audit/telemetry:
    post:
      tags:
      - Lock - Audit Telemetry
      summary: Save telemetry data
      description: Save telemetry data
      operationId: processTelemetryRequest
      requestBody:
        description: Telemetry entry
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEntry"
      responses:
        "200":
          description: Ok
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/telemetry.write
  /api/v1/policy:
    get:
      tags:
      - Lock - Policy
      summary: Request policies URI list
      description: Request policies URI list
      operationId: getPoliciesUriList
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/policy.readonly
  /api/v1/policy/{uri}:
    get:
      tags:
      - Lock - Policy
      summary: Request policy data
      description: "Request policy data. Returns legacy policy JSON, or the .cjar\
        \ archive for archive sources (keyed by policy_store.id)"
      operationId: getPolicyByUri
      parameters:
      - name: uri
        in: path
        description: Policy URI
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: string
            application/zip:
              schema:
                type: string
                description: Policy store archive (.cjar)
                format: binary
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/policy.readonly
  /api/v1/policy/{uri}/sigstore:
    get:
      tags:
      - Lock - Policy
      summary: Request policy store Sigstore bundle
      description: Request the Sigstore bundle published next to a .cjar policy store
        source
      operationId: getPolicySigstoreBundle
      parameters:
      - name: uri
        in: path
        description: Policy store id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: string
        "401":
          description: Unauthorized
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/policy.readonly
  /api/v1/policy/stores:
    get:
      tags:
      - Lock - Policy
      summary: List loaded policy store archives
      description: "List loaded .cjar policy stores with version, source and bundle\
        \ hash"
      operationId: getPolicyStores
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: PolicyStore
        "401":
          description: Unauthorized
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/policy.readonly
  /api/v1/internal/stat:
    get:
      tags:
      - Lock - Stat
      summary: Request stat data
      description: Request stat data
      operationId: statGet
      parameters:
      - name: month
        in: query
        schema:
          type: string
      - name: start-month
        in: query
        schema:
          type: string
      - name: end-month
        in: query
        schema:
          type: string
      - name: format
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlatStatResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Future stat is disabled on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/stat.readonly
    post:
      tags:
      - Lock - Stat
      summary: Request stat data
      description: Request stat data
      operationId: statPost
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              properties:
                month:
                  type: string
                start-month:
                  type: string
                end-month:
                  type: string
                format:
                  type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlatStatResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Future stat is disabled on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/stat.readonly
  /api/v1/audit/trace/admin/producer-chains:
    get:
      tags:
      - Lock - Audit Trace Admin
      summary: List producer chains
      description: List registered producer chains in the caller's evidence domain
      operationId: listProducerChains
      parameters:
      - name: producer_id
        in: query
        description: Restrict the result to one producer id
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerChainListResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.admin
    post:
      tags:
      - Lock - Audit Trace Admin
      summary: Register a producer chain
      description: Pre-register a producer chain
      operationId: registerProducerChain
      requestBody:
        description: Producer chain registration request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerChainRegistrationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerChainResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.admin
  /api/v1/audit/trace/admin/producer-keys:
    get:
      tags:
      - Lock - Audit Trace Admin
      summary: List producer keys
      description: List registered producer keys in the caller's evidence domain
      operationId: listProducerKeys
      parameters:
      - name: producer_id
        in: query
        description: Restrict the result to one producer id
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerKeyListResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.admin
    post:
      tags:
      - Lock - Audit Trace Admin
      summary: Register a producer key
      description: Register a producer's Ed25519 verification key
      operationId: registerProducerKey
      requestBody:
        description: Producer key registration request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerKeyRegistrationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerKeyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.admin
  /api/v1/audit/trace/admin/producer-keys/revoke:
    post:
      tags:
      - Lock - Audit Trace Admin
      summary: Revoke a producer key
      description: Revoke a registered producer key (idempotent)
      operationId: revokeProducerKey
      requestBody:
        description: Producer key revocation request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducerKeyRevokeRequest"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProducerKeyResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockApiError"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.admin
  /api/v1/audit/trace/executions/{trace_execution_id}:
    get:
      tags:
      - Lock - Audit Trace
      summary: Retrieve one TRACE execution
      description: "All direct records of an execution, ordered by receipt sequence"
      operationId: getExecution
      parameters:
      - name: trace_execution_id
        in: path
        required: true
        schema:
          type: string
      - name: execution_authority
        in: query
        description: Disambiguate a bare trace_execution_id used by more than one
          authority
        schema:
          type: string
      - name: start
        in: query
        description: Paging offset
        schema:
          type: integer
          format: int32
          default: 0
      - name: count
        in: query
        description: "Paging size, 1-1000"
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceExecutionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.readonly
  /api/v1/audit/trace/records:
    get:
      tags:
      - Lock - Audit Trace
      summary: Search TRACE records by policy store release
      description: "Records whose trace.policy names the given policy store id, version\
        \ or bundle hash, optionally within a receipt time range, ordered by receipt\
        \ sequence"
      operationId: searchRecords
      parameters:
      - name: policy_store_id
        in: query
        description: trace.policy.policy_store_id to match
        schema:
          type: string
      - name: policy_store_version
        in: query
        description: trace.policy.policy_store_version to match
        schema:
          type: string
      - name: bundle_hash
        in: query
        description: trace.policy.bundle_hash to match
        schema:
          type: string
      - name: received_from
        in: query
        description: "Earliest received_at, RFC 3339, inclusive"
        schema:
          type: string
      - name: received_to
        in: query
        description: "Latest received_at, RFC 3339, inclusive"
        schema:
          type: string
      - name: start
        in: query
        description: Paging offset
        schema:
          type: integer
          format: int32
          default: 0
      - name: count
        in: query
        description: "Paging size, 1-1000"
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceRecordSearchResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.readonly
  /api/v1/audit/trace/records/{record_id}:
    get:
      tags:
      - Lock - Audit Trace
      summary: Retrieve one TRACE record
      description: Domain-scoped retrieval of a stored envelope by record identity
      operationId: getRecord
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
      - name: producer_id
        in: query
        description: Disambiguate a bare record_id used by more than one producer
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceRecordResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.readonly
  /api/v1/audit/trace/bulk:
    post:
      tags:
      - Lock - Audit Trace
      summary: Submit a batch of TRACE evidence records
      description: "Verify and ingest a JSON array of signed TRACE assertions, continuing\
        \ past per-item failures. One producer per batch"
      operationId: submitBulkRecords
      requestBody:
        description: JSON array of TRACE assertions
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        "207":
          description: Multi-Status (per-item outcomes in the body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceBulkIngestionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.write
  /api/v1/audit/trace:
    post:
      tags:
      - Lock - Audit Trace
      summary: Submit a TRACE evidence record
      description: Verify and ingest a single signed TRACE assertion
      operationId: submitRecord
      requestBody:
        description: TRACE assertion
        content:
          application/json:
            schema:
              type: object
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceAcceptanceResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceErrorResponse"
      security:
      - oauth2:
        - https://jans.io/oauth/lock/trace.write
components:
