# Defaults for automatic_enpoints_tests.sh (audit + TRACE REST/gRPC endpoint tests).
#
# Resolution order, highest first:
#   1. environment variable LOCK_<KEY>, with dots and dashes as underscores and upper case,
#      for example LOCK_TRACE_CLIENT_SECRET
#   2. automatic_enpoints_tests.local.properties in this folder (git-ignored: put secrets here)
#   3. the client test profile
#      ../../../../client/profiles/<test.profile>/config-jans-lock-test-data.properties
#      (it provides test.server.name and trace.client.*; skipped when the file does not exist)
#   4. this file
#
# Values that are empty or start with CHANGE_ME count as not configured: the matching test
# section is skipped.

# Client test profile folder name under lock-server/client/profiles
test.profile=jans-dev.jans.info

# Lock server under test: https://<test.server.name> and <test.server.name>:443 for gRPC
test.server.name=server.example.org
# gRPC host:port, when it differs from <test.server.name>:443
grpc.address=

# Accept self-signed server certificates (curl -k, grpcurl -insecure)
tls.insecure=true

# Run the sections
test.audit=true
test.trace=true

# Audit tests: client with the log, health and telemetry write scopes
audit.client.id=CHANGE_ME
audit.client.secret=CHANGE_ME

# TRACE tests: client bound to an evidence domain, with the scopes
#   https://jans.io/oauth/lock/trace.write
#   https://jans.io/oauth/lock/trace.readonly
#   https://jans.io/oauth/lock/trace.admin
trace.client.id=CHANGE_ME
trace.client.secret=CHANGE_ME

invalid.token=this-is-definitely-not-a-valid-token
