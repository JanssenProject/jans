# -Dcfg=<profile name>; see ../README.md.
test.server.name=CHANGE_ME

# Client for the TRACE tests of server/src/test/manual/automatic_enpoints_tests.sh, which reads
# this file when the profile is selected there (test.profile). Register the client
# with these three scopes manually - the setup-generated lock client only gets
# scopes from lock-plugin-swagger.yaml, not from jans-lock's own YAML):
#   https://jans.io/oauth/lock/trace.write
#   https://jans.io/oauth/lock/trace.readonly
#   https://jans.io/oauth/lock/trace.admin
trace.client.id=
trace.client.secret=
