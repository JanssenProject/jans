# server_tokens off;
geo $literal_dollar {
    default "$";
}

%(upstream_includes)s

# Security headers, added only when the upstream app did not set its own
# (an empty value makes add_header skip the header).
# jans-auth must stay frameable cross-origin (OIDC check_session iframe, prompt=none).
map "$upstream_http_content_security_policy|$uri" $sec_csp {
    "~^\|/jans-auth(/|$)" "object-src 'none'; base-uri 'self'";
    "~^\|" "frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
    default "";
}
map "$upstream_http_x_frame_options|$uri" $sec_xfo {
    "~^\|/jans-auth(/|$)" "";
    "~^\|" "SAMEORIGIN";
    default "";
}
map $upstream_http_x_content_type_options $sec_xcto {
    "" "nosniff";
    default "";
}
map $upstream_http_strict_transport_security $sec_hsts {
    "" "max-age=31536000";
    default "";
}
map $upstream_http_permissions_policy $sec_pp {
    "" "camera=(), microphone=(), geolocation=(), payment=()";
    default "";
}
map $upstream_http_cross_origin_resource_policy $sec_corp {
    "" "same-site";
    default "";
}
# COOP/COEP left unset: they sever window.opener and break popup-based
# OIDC flows (e.g. response_mode=web_message) used by relying parties.

client_header_timeout 300;
client_body_timeout 300;
%(tunables)s
server {
    listen 8080 default_server;
    server_name _;
    gzip on;
    http2 on;

    root /var/lib/nginx/html;
    index index.html;

    add_header Content-Security-Policy $sec_csp always;
    add_header X-Frame-Options $sec_xfo always;
    add_header X-Content-Type-Options $sec_xcto always;
    add_header Strict-Transport-Security $sec_hsts always;
    add_header Permissions-Policy $sec_pp always;
    add_header Cross-Origin-Resource-Policy $sec_corp always;

    %(location_includes)s
}
