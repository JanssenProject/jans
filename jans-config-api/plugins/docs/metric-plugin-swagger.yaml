openapi: 3.0.1
info:
  title: Jans Config API - Metric
  contact:
    name: Gluu Support
    url: https://support.gluu.org
    email: support@gluu.org
  license:
    name: Apache 2.0
    url: https://github.com/JanssenProject/jans/blob/main/LICENSE
  version: 1.0.0
servers:
- url: https://jans.io/
  description: The Jans server
tags:
- name: Metric
paths:
  /metric/aggregations:
    get:
      tags:
      - Metric
      summary: Get aggregated metric entries within a time range.
      description: "Returns a page of jansMetricAggregation entries for an aggregation\
        \ period (HOURLY, DAILY, WEEKLY, MONTHLY) within the given date range. Entries\
        \ are computed by the application nodes from the raw jansMetric rows, in UTC\
        \ (weeks are ISO weeks starting Monday). Aggregates are cluster-wide totals\
        \ per application type, metric type and metric subtype. An entry covers a\
        \ whole period: jansStartDate is the first millisecond of the period and jansEndDate\
        \ is the last one (period end minus 1 ms, for example 2026-11-24T23:59:59.999Z\
        \ for a DAILY entry). The date range is a containment filter: an entry matches\
        \ only when it lies completely inside the range (jansStartDate >= start_date\
        \ AND jansEndDate <= end_date). An entry that starts before start_date or\
        \ ends after end_date is not returned, so a request for a partial period does\
        \ not return that period's entry. The 'data' field of each entry is a JSON\
        \ object. Counter: {\"kind\":\"counter\",\"count\":13,\"sourceRows\":2,\"\
        nodes\":2,\"complete\":true,\"legacyDelta\":false}. Timer: {\"kind\":\"timer\"\
        ,\"count\":40,\"rate\":0.0111,\"rateUnit\":\"second\",\"min\":1.0,\"max\"\
        :40.0,\"mean\":8.0,\"median\":7.0,\"value75thPercentile\":9.0,\"value95thPercentile\"\
        :17.5,\"value98thPercentile\":21.75,\"value99thPercentile\":26.25,\"value999thPercentile\"\
        :33.25,\"durationUnit\":\"milliseconds\",\"approximate\":true,\"sourceRows\"\
        :2,\"nodes\":2,\"complete\":false,\"legacyDelta\":false}. Fields: count is\
        \ the number of events in the period (for a timer, the number of timed calls),\
        \ summed from per-interval deltas; sourceRows is the number of raw rows the\
        \ aggregate covers; nodes is the number of nodes that reported (in WEEKLY,\
        \ MONTHLY and DAILY entries it is a lower bound: the largest value among the\
        \ child entries); complete is true when the entry was computed after its period\
        \ closed and its source data was complete, so false means the period is still\
        \ open or data may still arrive; legacyDelta is true when some counts came\
        \ from raw rows written by an older version without a per-interval count,\
        \ whose first row of a series counts as 0. Timer fields: rate is count divided\
        \ by the period length in seconds; min is the smallest and max the largest\
        \ value reported in any row; mean, median and the percentiles are weighted\
        \ averages of the per-row values and are approximate (approximate is always\
        \ true); durationUnit is the unit of min, max, mean, median and the percentiles.\
        \ A timer with count 0 has null for min, max, mean, median and the percentiles.\
        \ Rows that arrive after the recompute window (by default the last 2 closed\
        \ HOURLY periods and the last closed DAILY, WEEKLY and MONTHLY period) are\
        \ not counted. If 'data' does not hold valid JSON, it is returned as a string."
      operationId: get-metric-aggregations
      parameters:
      - name: aggregationType
        in: query
        description: "Aggregation period. One of HOURLY, DAILY, WEEKLY, MONTHLY."
        required: true
        schema:
          type: string
      - name: appType
        in: query
        description: "Application type (jansAppTyp) to narrow the search, for example\
          \ jans_auth or fido2."
        schema:
          type: string
      - name: metricType
        in: query
        description: Metric type (jansMetricTyp) to narrow the search.
        schema:
          type: string
      - name: subType
        in: query
        description: Metric subtype (jansMetricSubTyp) to narrow the search.
        schema:
          type: string
      - name: start_date
        in: query
        description: "Start date/time. Accepted formats: ISO-8601 date-time (e.g.\
          \ 2026-08-01T00:00:00Z), ISO-8601 date (e.g. 2026-08-01) or legacy dd-MM-yyyy;\
          \ a date means 00:00:00.000 UTC of that day. Only entries with jansStartDate\
          \ on or after this instant match."
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: "End date/time, inclusive. Same formats as start_date. A date-time\
          \ without a fractional second (e.g. 2026-08-01T23:59:59Z) is read as the\
          \ end of that second (23:59:59.999), and a date (e.g. 2026-08-01) as the\
          \ end of that day (23:59:59.999 UTC), because entries end 1 ms before a\
          \ period boundary. A date-time with a non-zero fractional second is used\
          \ as given. Only entries with jansEndDate on or before this instant match."
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return
        schema:
          type: integer
          format: int32
          default: 50
      - name: startIndex
        in: query
        description: The 0-based index of the first query result
        schema:
          type: integer
          format: int32
          default: 0
      - name: sortBy
        in: query
        description: "Attribute to sort by. One of jansStartDate, jansEndDate, creationDate."
        schema:
          type: string
          default: jansStartDate
      - name: sortOrder
        in: query
        description: Sort order - ascending or descending.
        schema:
          type: string
          default: descending
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricAggregationPagedResult"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/metric.readonly
      - oauth2:
        - https://jans.io/oauth/config/read-all
  /metric/app-types:
    get:
      tags:
      - Metric
      summary: Get application types reporting metrics.
      description: Discovers the distinct application types (jansAppTyp) present in
        jansMetric data.
      operationId: get-metric-app-types
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Unauthorized
        "500":
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/metric.readonly
      - oauth2:
        - https://jans.io/oauth/config/read-all
  /metric/entries:
    get:
      tags:
      - Metric
      summary: Get metric entries within a time range.
      description: "Returns a page of raw jansMetric entries for a metric type (and,\
        \ optionally, application type and subtype) within the given date range. When\
        \ subType is omitted, both plain and per-subtype rows are returned. The date\
        \ range is a containment filter: an entry matches only when it lies completely\
        \ inside the range (jansStartDate >= start_date AND jansEndDate <= end_date).\
        \ An entry that starts before start_date or ends after end_date is not returned,\
        \ so a request for a partial period does not return that period's entry."
      operationId: get-metric-entries
      parameters:
      - name: metricType
        in: query
        description: "Metric type (jansMetricTyp), for example user_authentication_success."
        required: true
        schema:
          type: string
      - name: appType
        in: query
        description: "Application type (jansAppTyp) to narrow the search, for example\
          \ jans_auth or fido2."
        schema:
          type: string
      - name: subType
        in: query
        description: "Metric subtype (jansMetricSubTyp). When omitted, both plain\
          \ and per-subtype rows are returned."
        schema:
          type: string
      - name: start_date
        in: query
        description: "Start date/time. Accepted formats: ISO-8601 date-time (e.g.\
          \ 2026-08-01T00:00:00Z), ISO-8601 date (e.g. 2026-08-01) or legacy dd-MM-yyyy;\
          \ a date means 00:00:00.000 UTC of that day. Only entries with jansStartDate\
          \ on or after this instant match."
        required: true
        schema:
          type: string
      - name: end_date
        in: query
        description: "End date/time, inclusive. Same formats as start_date. A date-time\
          \ without a fractional second (e.g. 2026-08-01T23:59:59Z) is read as the\
          \ end of that second (23:59:59.999), and a date (e.g. 2026-08-01) as the\
          \ end of that day (23:59:59.999 UTC), because entries end 1 ms before a\
          \ period boundary. A date-time with a non-zero fractional second is used\
          \ as given. Only entries with jansEndDate on or before this instant match."
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return
        schema:
          type: integer
          format: int32
          default: 50
      - name: startIndex
        in: query
        description: The 0-based index of the first query result
        schema:
          type: integer
          format: int32
          default: 0
      - name: sortBy
        in: query
        description: "Attribute to sort by. One of jansStartDate, jansEndDate, creationDate."
        schema:
          type: string
          default: jansStartDate
      - name: sortOrder
        in: query
        description: Sort order - ascending or descending.
        schema:
          type: string
          default: descending
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricEntryPagedResult"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/metric.readonly
      - oauth2:
        - https://jans.io/oauth/config/read-all
  /metric/types:
    get:
      tags:
      - Metric
      summary: Get metric types reported by applications.
      description: "Discovers the distinct metric types (jansMetricTyp), and their\
        \ subtypes (jansMetricSubTyp) when present, found in jansMetric data - optionally\
        \ filtered by application type (jansAppTyp) and narrowed to a date range."
      operationId: get-metric-types
      parameters:
      - name: appType
        in: query
        description: "Application type (jansAppTyp) to narrow the search, for example\
          \ jans_auth or fido2."
        schema:
          type: string
      - name: start_date
        in: query
        description: "Narrows the discovery scan. Start date/time. Accepted formats:\
          \ ISO-8601 date-time (e.g. 2026-08-01T00:00:00Z), ISO-8601 date (e.g. 2026-08-01)\
          \ or legacy dd-MM-yyyy; a date means 00:00:00.000 UTC of that day. Only\
          \ entries with jansStartDate on or after this instant match."
        schema:
          type: string
      - name: end_date
        in: query
        description: "Narrows the discovery scan. End date/time, inclusive. Same formats\
          \ as start_date. A date-time without a fractional second (e.g. 2026-08-01T23:59:59Z)\
          \ is read as the end of that second (23:59:59.999), and a date (e.g. 2026-08-01)\
          \ as the end of that day (23:59:59.999 UTC), because entries end 1 ms before\
          \ a period boundary. A date-time with a non-zero fractional second is used\
          \ as given. Only entries with jansEndDate on or before this instant match."
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricTypeInfo"
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: InternalServerError
      security:
      - oauth2:
        - https://jans.io/oauth/config/metric.readonly
      - oauth2:
        - https://jans.io/oauth/config/read-all
components:
  schemas:
    JsonNode:
      type: object
    MetricAggregationEntry:
      type: object
      properties:
        dn:
          type: string
        id:
          type: string
        aggregationType:
          type: string
          enum:
          - HOURLY
          - DAILY
          - WEEKLY
          - MONTHLY
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        applicationType:
          type: string
        metricType:
          type: string
        metricSubType:
          type: string
        creationDate:
          type: string
          format: date-time
        nodeIdentifier:
          type: string
        expirationDate:
          type: string
          format: date-time
        ttl:
          type: integer
          format: int32
        deletable:
          type: boolean
        data:
          $ref: "#/components/schemas/JsonNode"
    MetricAggregationPagedResult:
      type: object
      properties:
        start:
          type: integer
          format: int32
        totalEntriesCount:
          type: integer
          format: int32
        entriesCount:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MetricAggregationEntry"
    MetricDataEntry:
      type: object
      properties:
        dn:
          type: string
        id:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        applicationType:
          type: string
        metricType:
          type: string
        metricSubType:
          type: string
        creationDate:
          type: string
          format: date-time
        nodeIdentifier:
          type: string
        expirationDate:
          type: string
          format: date-time
        ttl:
          type: integer
          format: int32
        deletable:
          type: boolean
        data:
          $ref: "#/components/schemas/JsonNode"
    MetricEntryPagedResult:
      type: object
      properties:
        start:
          type: integer
          format: int32
        totalEntriesCount:
          type: integer
          format: int32
        entriesCount:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MetricDataEntry"
    MetricTypeInfo:
      type: object
      properties:
        appType:
          type: string
        metricType:
          type: string
        subTypes:
          uniqueItems: true
          type: array
          items:
            type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: "https://{op-hostname}/.../token"
          scopes:
            https://jans.io/oauth/config/metric.readonly: View metric related information
            https://jans.io/oauth/config/read-all: Super admin for viewing application
              resource information
