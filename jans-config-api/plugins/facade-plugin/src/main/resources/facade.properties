# Directory read by the daily job. It holds either authorization.json (the job runs the authorizations through
# Cedarling and collects the resulting traces from Lock), or Lock TRACE execution files (*.json, *.jsonl) with
# optionally run.json ({"test_start": "<ISO instant>"}) and truth.json (injected anomalies).
facade.input.dir=/opt/jans/jetty/jans-config-api/custom/config/facade/input

# Directory holding the Cedar policy store the send job loads: metadata.json, schema.cedarschema and policies/.
# trusted-issuers is ignored; the job generates it. If metadata.json is not found here, the policy-store-acme
# bundled in the plugin jar is used instead.
facade.policystore.dir=/opt/jans/jetty/jans-config-api/custom/config/input/policy-store-acme

# Directory the job writes FACADE files, scores and logs to.
facade.output.dir=/opt/jans/jetty/jans-config-api/custom/config/facade/output

# Three jobs, each on its own timer. Times are in seconds (3600 = one hour).
#   send    - Cedarling authorizes the requests in authorization.json and sends the TRACE records to Lock.
#   collect - fetches the TRACE records back from Lock. Lock takes time to store them, so a collection that finds
#             records missing is tried again on the next run.
#   train   - converts the collected traces to FACADE files and trains FACADE.
# The first collect runs one send interval after the first send, and the first train one collect interval after the
# first collect, unless the initial delays below are set.
facade.job.enabled=true
facade.send.initial.delay.seconds=60
facade.send.interval.seconds=300
facade.collect.interval.seconds=300
facade.train.interval.seconds=300
# facade.collect.initial.delay.seconds=
# facade.train.initial.delay.seconds=
# Tries for a collection or training that keeps failing, before it stops until there is new data.
facade.job.max.attempts=3
# false: the send job skips authorization.json when it is the same as at the last send.
facade.job.rerun.unchanged=false

# Lock and Auth Server, used when the input is authorization.json. Set the client secret with the environment
# variable FACADE_LOCK_CLIENT_SECRET or a system property, not in this file. The client needs the scopes
# https://jans.io/oauth/lock/trace.admin, trace.write and trace.readonly.
facade.lock.base.url=https://admin-ui-test.gluu.org/
facade.auth.base.url=https://admin-ui-test.gluu.org/
facade.lock.client.id=2200.83fa6abc-dcfb-4036-a707-c51dcc08d2bd
facade.lock.client.secret=eFITXCBABQU3
facade.collect.timeout.seconds=60

# FACADE checkout, for training and scoring. Leave empty to only write the converted files.
facade.dir=/opt/facade
facade.python=
facade.run=true
facade.trainingExamples=20000
facade.testFraction=0.2
facade.snapshotSeconds=auto
facade.historySeconds=auto
facade.lookbackSeconds=auto
facade.dedupSeconds=auto
facade.actionKinds=AUTHORIZATION_DECISION
facade.outcomes=ALLOW,SUCCESS
facade.peerAttrs=execution
facade.timeSource=signed_at
