<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-label="Component diagram: inside jans-auth-server, the existing DCR endpoint gains a new EAT attestation gate feeding the client store; the existing token endpoint and DPoP validator feed a new SVID minter that signs with new jwt-svid keys published by a new bundle endpoint; externally, the agent enrolls and requests tokens, while SPIRE servers and plain JWT verifiers periodically fetch the bundle.">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16211f"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="500" fill="#ffffff"/>
  <g fill="#16211f" font-size="11.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- server boundary -->
    <rect x="30" y="34" width="710" height="440" rx="12" fill="none" stroke="#b6c5c1" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="52" y="62" font-weight="700" font-size="14">jans-auth-server</text>

    <rect x="60" y="92" width="190" height="54" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
    <text x="155" y="115" text-anchor="middle" font-weight="600" font-size="12.5">DCR endpoint</text>
    <text x="155" y="133" text-anchor="middle" font-size="10.5" fill="#5c6b68">/register &#183; CIMD-aware</text>

    <rect x="60" y="182" width="190" height="66" rx="8" fill="#e3f0ee" stroke="#0f766e" stroke-width="1.5"/>
    <text x="155" y="205" text-anchor="middle" font-weight="600" font-size="12.5">EAT attestation gate</text>
    <text x="155" y="223" text-anchor="middle" font-size="10.5" fill="#5c6b68">(interception script first,</text>
    <text x="155" y="238" text-anchor="middle" font-size="10.5" fill="#5c6b68">native later)</text>

    <rect x="60" y="292" width="190" height="70" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
    <text x="155" y="315" text-anchor="middle" font-weight="600" font-size="12.5">Client store</text>
    <text x="155" y="333" text-anchor="middle" font-size="10.5" fill="#5c6b68">+ enclave key binding</text>
    <text x="155" y="348" text-anchor="middle" font-size="10.5" fill="#5c6b68">+ assigned SPIFFE ID</text>

    <rect x="300" y="92" width="190" height="54" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
    <text x="395" y="115" text-anchor="middle" font-weight="600" font-size="12.5">Token endpoint</text>
    <text x="395" y="133" text-anchor="middle" font-size="10.5" fill="#5c6b68">/token &#183; client_credentials</text>

    <rect x="300" y="182" width="190" height="54" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
    <text x="395" y="205" text-anchor="middle" font-weight="600" font-size="12.5">DPoP validator</text>
    <text x="395" y="223" text-anchor="middle" font-size="10.5" fill="#5c6b68">RFC 9449 &#183; ships today</text>

    <rect x="300" y="272" width="190" height="66" rx="8" fill="#e3f0ee" stroke="#0f766e" stroke-width="1.5"/>
    <text x="395" y="295" text-anchor="middle" font-weight="600" font-size="12.5">SVID minter</text>
    <text x="395" y="313" text-anchor="middle" font-size="10.5" fill="#5c6b68">sub = derived SPIFFE ID &#183; aud</text>
    <text x="395" y="328" text-anchor="middle" font-size="10.5" fill="#5c6b68">from request &#183; short exp &#183; cnf</text>

    <rect x="300" y="378" width="190" height="58" rx="8" fill="#e3f0ee" stroke="#0f766e" stroke-width="1.5"/>
    <text x="395" y="401" text-anchor="middle" font-weight="600" font-size="12.5">SVID signing keys</text>
    <text x="395" y="419" text-anchor="middle" font-size="10.5" fill="#5c6b68">tagged use: jwt-svid &#183; rotated</text>

    <rect x="530" y="378" width="190" height="58" rx="8" fill="#e3f0ee" stroke="#0f766e" stroke-width="1.5"/>
    <text x="625" y="401" text-anchor="middle" font-weight="600" font-size="12.5">Bundle endpoint</text>
    <text x="625" y="419" text-anchor="middle" font-size="10.5" fill="#5c6b68">/spiffe/bundle &#183; Phase 1</text>

    <rect x="530" y="92" width="190" height="54" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
    <text x="625" y="115" text-anchor="middle" font-weight="600" font-size="12.5">Introspection</text>
    <text x="625" y="133" text-anchor="middle" font-size="10.5" fill="#5c6b68">RFC 7662 &#183; online checks</text>

    <g stroke="#16211f">
      <line x1="155" y1="146" x2="155" y2="176" marker-end="url(#arr3)"/>
      <line x1="155" y1="248" x2="155" y2="286" marker-end="url(#arr3)"/>
      <line x1="395" y1="146" x2="395" y2="176" marker-end="url(#arr3)"/>
      <line x1="395" y1="236" x2="395" y2="266" marker-end="url(#arr3)"/>
      <line x1="395" y1="338" x2="395" y2="372" marker-end="url(#arr3)"/>
      <line x1="490" y1="407" x2="524" y2="407" marker-end="url(#arr3)"/>
      <line x1="250" y1="327" x2="294" y2="305" marker-end="url(#arr3)"/>
    </g>
    <g font-size="10" fill="#5c6b68" font-family="Consolas, Menlo, 'Courier New', monospace">
      <text x="163" y="166">gates approval</text>
      <text x="163" y="272">binds on success</text>
      <text x="403" y="166">proof check</text>
      <text x="403" y="256">key = enrolled?</text>
      <text x="403" y="360">signs with</text>
      <text x="497" y="399">published as</text>
      <text x="238" y="290">lookup</text>
    </g>

    <!-- external actors -->
    <rect x="810" y="72" width="270" height="100" rx="8" fill="#edf3f1" stroke="#b6c5c1"/>
    <text x="945" y="98" text-anchor="middle" font-weight="600" font-size="13">AI agent</text>
    <text x="945" y="118" text-anchor="middle" font-size="10.5" fill="#5c6b68">enrolls with EAT evidence,</text>
    <text x="945" y="133" text-anchor="middle" font-size="10.5" fill="#5c6b68">then requests SVIDs with DPoP</text>
    <text x="945" y="153" text-anchor="middle" font-size="10.5" fill="#5c6b68">runs on anyone's infrastructure</text>

    <rect x="810" y="298" width="270" height="60" rx="8" fill="#edf3f1" stroke="#b6c5c1"/>
    <text x="945" y="322" text-anchor="middle" font-weight="600" font-size="13">SPIRE server</text>
    <text x="945" y="342" text-anchor="middle" font-size="10.5" fill="#5c6b68">federates_with &#8594; distributes to workloads</text>

    <rect x="810" y="382" width="270" height="60" rx="8" fill="#edf3f1" stroke="#b6c5c1"/>
    <text x="945" y="406" text-anchor="middle" font-weight="600" font-size="13">Any JWT verifier</text>
    <text x="945" y="426" text-anchor="middle" font-size="10.5" fill="#5c6b68">plain JWKS fetch &#183; no SPIFFE tooling</text>

    <g stroke="#16211f">
      <path d="M810 105 C 770 105, 300 60, 253 92" fill="none" marker-end="url(#arr3)"/>
      <path d="M810 135 C 740 135, 540 80, 493 96" fill="none" marker-end="url(#arr3)"/>
      <path d="M810 328 C 770 328, 760 400, 724 404" fill="none" marker-end="url(#arr3)"/>
      <line x1="810" y1="410" x2="726" y2="410" marker-end="url(#arr3)"/>
    </g>
    <g font-size="10" fill="#5c6b68" font-family="Consolas, Menlo, 'Courier New', monospace">
      <text x="620" y="52">1 enroll + EAT</text>
      <text x="660" y="76">2 /token + DPoP</text>
      <text x="742" y="380">fetches periodically</text>
    </g>
  </g>
</svg>
