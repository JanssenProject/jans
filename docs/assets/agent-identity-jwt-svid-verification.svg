<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-label="Anatomy diagram: a JWT-SVID's claims each map to a verification check — signature against the bundle key, sub against identity policy, aud against the service itself, exp against the clock, and cnf.jkt against a fresh DPoP proof signed by the enclave-resident key.">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16211f"/>
    </marker>
    <marker id="arr2A" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="590" fill="#ffffff"/>
  <g fill="#16211f" font-size="12" font-family="Consolas, Menlo, 'Courier New', monospace">

    <!-- left: TEE + proof -->
    <rect x="30" y="150" width="210" height="96" rx="8" fill="#edf3f1" stroke="#b6c5c1"/>
    <text x="135" y="176" text-anchor="middle" font-weight="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Hardware secure element</text>
    <text x="135" y="198" text-anchor="middle" font-size="11">enclave private key</text>
    <text x="135" y="215" text-anchor="middle" font-size="10.5" fill="#5c6b68">non-exportable &#183; attested at DCR</text>

    <line x1="135" y1="246" x2="135" y2="330" stroke="#16211f" marker-end="url(#arr2)"/>
    <text x="147" y="292" font-size="10.5" fill="#5c6b68">signs, per request</text>

    <rect x="30" y="334" width="210" height="76" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
    <text x="135" y="360" text-anchor="middle" font-weight="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Fresh DPoP proof</text>
    <text x="135" y="380" text-anchor="middle" font-size="10.5">htu &#183; htm &#183; jti &#183; iat</text>
    <text x="135" y="396" text-anchor="middle" font-size="10.5" fill="#5c6b68">sent alongside the token</text>

    <path d="M240 372 C 300 372, 300 452, 348 452" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr2A)"/>

    <!-- center: token card -->
    <rect x="352" y="60" width="380" height="440" rx="10" fill="#ffffff" stroke="#b6c5c1" stroke-width="1.5"/>
    <rect x="352" y="60" width="380" height="44" rx="10" fill="#e3f0ee"/>
    <line x1="352" y1="104" x2="732" y2="104" stroke="#b6c5c1"/>
    <text x="542" y="88" text-anchor="middle" font-weight="600" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">JWT-SVID &#8212; issued by jans-auth-server</text>

    <g font-size="12">
      <text x="376" y="140" fill="#5c6b68">header</text>
      <text x="376" y="158">alg: ES256 &#183; kid: 7f3a &#183; typ: JWT</text>
      <line x1="366" y1="176" x2="718" y2="176" stroke="#d4dedb"/>

      <text x="376" y="200" fill="#5c6b68">sub</text>
      <text x="376" y="218">spiffe://op.example.org/agent/3f9c</text>
      <line x1="366" y1="236" x2="718" y2="236" stroke="#d4dedb"/>

      <text x="376" y="260" fill="#5c6b68">aud</text>
      <text x="376" y="278">https://rp.example.com</text>
      <line x1="366" y1="296" x2="718" y2="296" stroke="#d4dedb"/>

      <text x="376" y="320" fill="#5c6b68">iat / exp</text>
      <text x="376" y="338">10-minute lifetime</text>
      <line x1="366" y1="356" x2="718" y2="356" stroke="#d4dedb"/>

      <text x="376" y="380" fill="#0a5c56" font-weight="600">cnf</text>
      <text x="376" y="398" fill="#0a5c56" font-weight="600">{ jkt: "9XKt&#8230;" }  &#8592; key thumbprint</text>
      <line x1="366" y1="416" x2="718" y2="416" stroke="#d4dedb"/>

      <text x="376" y="444" fill="#5c6b68">signature</text>
      <text x="376" y="462">by a jans jwt-svid bundle key</text>
    </g>

    <!-- right: check stack -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <rect x="812" y="48" width="278" height="84" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
      <text x="828" y="72" font-weight="600" font-size="13">&#9312; signature &#8594; bundle key</text>
      <text x="828" y="92" font-size="11.5" fill="#5c6b68">bundle cached from jans /spiffe/bundle,</text>
      <text x="828" y="108" font-size="11.5" fill="#5c6b68">fetched directly or via SPIRE federation</text>

      <rect x="812" y="152" width="278" height="62" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
      <text x="828" y="176" font-weight="600" font-size="13">&#9313; sub &#8594; identity policy</text>
      <text x="828" y="196" font-size="11.5" fill="#5c6b68">is this SPIFFE ID authorized here?</text>

      <rect x="812" y="234" width="278" height="62" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
      <text x="828" y="258" font-weight="600" font-size="13">&#9314; aud &#8594; this service</text>
      <text x="828" y="278" font-size="11.5" fill="#5c6b68">token was minted for me, not replayed</text>

      <rect x="812" y="316" width="278" height="62" rx="8" fill="#ffffff" stroke="#b6c5c1"/>
      <text x="828" y="340" font-weight="600" font-size="13">&#9315; exp &#8594; clock</text>
      <text x="828" y="360" font-size="11.5" fill="#5c6b68">short TTL is the revocation story</text>

      <rect x="812" y="398" width="278" height="100" rx="8" fill="#e3f0ee" stroke="#0f766e" stroke-width="1.5"/>
      <text x="828" y="422" font-weight="600" font-size="13">&#9316; cnf.jkt &#8596; DPoP proof key</text>
      <text x="828" y="442" font-size="11.5" fill="#3d4c49">proof verifies + thumbprints match</text>
      <text x="828" y="460" font-size="11.5" fill="#3d4c49">&#8658; the caller holds the enclave key</text>
      <text x="828" y="482" font-size="11.5" fill="#5c6b68">skipped by plain SPIFFE verifiers (bearer)</text>
    </g>

    <!-- connectors token -> checks -->
    <line x1="732" y1="453" x2="806" y2="98" stroke="#16211f" opacity="0.65" marker-end="url(#arr2)"/>
    <line x1="732" y1="209" x2="806" y2="183" stroke="#16211f" opacity="0.65" marker-end="url(#arr2)"/>
    <line x1="732" y1="269" x2="806" y2="265" stroke="#16211f" opacity="0.65" marker-end="url(#arr2)"/>
    <line x1="732" y1="329" x2="806" y2="347" stroke="#16211f" opacity="0.65" marker-end="url(#arr2)"/>
    <line x1="732" y1="389" x2="806" y2="440" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arr2A)"/>
  </g>
</svg>
