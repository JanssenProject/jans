apiVersion: v1
kind: Service
metadata:
  name: {{ index .Values "global" "auth-server" "authServerServiceName" }}
  namespace: {{ .Release.Namespace }}
  labels:
    APP_NAME: auth-server
{{ include "auth-server.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (index .Values.global "auth-server" "customAnnotations" "service") }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if index .Values.global "auth-server" "customAnnotations" "service" }}
{{ toYaml (index .Values.global "auth-server" "customAnnotations" "service") | indent 4 }}
{{- end }}
{{- end }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    name: {{ .Values.service.name }}
  selector:
    app: {{ .Release.Name }}-{{ include "auth-server.name" . }} #auth-server
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- with .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig:
{{ toYaml . | indent 4 }}
  {{- end }}

{{- /* gateway-api.routes.* is not visible from this subchart, so with Gateway API on the service must exist whenever Lock is on or the gRPC route would have no backend. Without Gateway API the legacy flag still governs. */ -}}
{{- if and (index .Values.global "auth-server" "lockEnabled") (or (index .Values.global "gateway-api" "enabled") (index .Values.global "auth-server" "ingress" "lockAuditEnabled")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ index .Values "global" "auth-server" "authServerServiceName" }}-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    APP_NAME: auth-server
{{ include "auth-server.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (index .Values.global "auth-server" "customAnnotations" "service") }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if index .Values.global "auth-server" "customAnnotations" "service" }}
{{ toYaml (index .Values.global "auth-server" "customAnnotations" "service") | indent 4 }}
{{- end }}
{{- end }}
spec:
  ports:
  - port: 50051 # avoid using the same pod port as some gateway implementation doesn't _like_ shared port for gRPC and non-gRPC
    targetPort: {{ .Values.service.port }}
    name: grpc-{{ .Values.service.name }}
    appProtocol: kubernetes.io/h2c
  selector:
    app: {{ .Release.Name }}-{{ include "auth-server.name" . }} #auth-server
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- with .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig:
{{ toYaml . | indent 4 }}
  {{- end }}
{{- end }}
