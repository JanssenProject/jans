{{- if not .Values.global.cnConfiguratorCustomSchema.secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-configuration-file
  namespace: {{ .Release.Namespace }}
  labels:
    APP_NAME: configurator
{{ include "config.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (.Values.global.config.customAnnotations.secret) }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if .Values.global.config.customAnnotations.secret }}
{{ toYaml .Values.global.config.customAnnotations.secret | indent 4 }}
{{- end }}
{{- end }}
type: Opaque
stringData:
  {{ .Values.global.cnConfiguratorConfigurationFile | base }}: |-
{{ include "config.prepareSchema" . | indent 4 }}
{{- end }}

---

{{- if .Values.global.cnConfiguratorKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-configuration-key-file
  namespace: {{ .Release.Namespace }}
  labels:
    APP_NAME: configurator
{{ include "config.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (.Values.global.config.customAnnotations.secret) }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if .Values.global.config.customAnnotations.secret }}
{{ toYaml .Values.global.config.customAnnotations.secret | indent 4 }}
{{- end }}
{{- end }}
type: Opaque
data:
  {{ .Values.global.cnConfiguratorKeyFile | base }}: {{ .Values.global.cnConfiguratorKey | b64enc }}
{{- end }}

---

{{ if .Values.configmap.cnSqlSslEnabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sql-ssl
  namespace: {{ .Release.Namespace }}
  labels:
    APP_NAME: configurator
{{ include "config.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (.Values.global.config.customAnnotations.secret) }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if .Values.global.config.customAnnotations.secret }}
{{ toYaml .Values.global.config.customAnnotations.secret | indent 4 }}
{{- end }}
{{- end }}
type: Opaque
data:
  sql_cacert.pem: {{ .Values.configmap.cnSqlSslCaCert }}
  sql_client_cert.pem: {{ .Values.configmap.cnSqlSslClientCert }}
  sql_client_key.pem: {{ .Values.configmap.cnSqlSslClientKey }}
{{- end }}

{{- /* on upgrade the configurator keeps the existing admin password, so only publish a generated one on install */}}
{{- if and (not .Values.global.cnConfiguratorCustomSchema.secretName) (not .Values.adminPassword) (or .Release.IsInstall (lookup "v1" "Secret" .Release.Namespace (printf "%s-admin-password" .Release.Name))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "config.labels" . | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "config.adminPassword" . | b64enc }}
{{- end }}
