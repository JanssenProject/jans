{{- if not .Values.cnConfiguratorCustomSchema.secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-configuration-file
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ include "janssen-all-in-one.name" . }}-aio
{{ include "janssen-all-in-one.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (.Values.customAnnotations.secret) }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if .Values.customAnnotations.secret }}
{{ toYaml .Values.customAnnotations.secret | indent 4 }}
{{- end }}
{{- end }}
type: Opaque
stringData:
  {{ .Values.cnConfiguratorConfigurationFile | base }}: |-
{{ include "janssen-all-in-one.config.prepareSchema" . | indent 4  }}
{{- end }}

---

{{- if .Values.cnConfiguratorKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-configuration-key-file
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ include "janssen-all-in-one.name" . }}-aio
{{ include "janssen-all-in-one.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (.Values.customAnnotations.secret) }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if .Values.customAnnotations.secret }}
{{ toYaml .Values.customAnnotations.secret | indent 4 }}
{{- end }}
{{- end }}
type: Opaque
data:
  {{ .Values.cnConfiguratorKeyFile | base }}: {{ .Values.cnConfiguratorKey | b64enc }}
{{- end }}

---

{{ if .Values.configmap.cnSqlSslEnabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-sql-ssl
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ include "janssen-all-in-one.name" . }}-aio
{{ include "janssen-all-in-one.labels" . | indent 4 }}
{{- if .Values.additionalLabels }}
{{ toYaml .Values.additionalLabels | indent 4 }}
{{- end }}
{{- if or (.Values.additionalAnnotations) (.Values.customAnnotations.secret) }}
  annotations:
{{- if .Values.additionalAnnotations }}
{{ toYaml .Values.additionalAnnotations | indent 4 }}
{{- end }}
{{- if .Values.customAnnotations.secret }}
{{ toYaml .Values.customAnnotations.secret | indent 4 }}
{{- end }}
{{- end }}
type: Opaque
data:
  sql_cacert.pem: {{ .Values.configmap.cnSqlSslCaCert }}
  sql_client_cert.pem: {{ .Values.configmap.cnSqlSslClientCert }}
  sql_client_key.pem: {{ .Values.configmap.cnSqlSslClientKey }}
{{- end }}

{{- /* on upgrade the configurator keeps the existing admin password, so only publish a generated one on install */}}
{{- if and (not .Values.cnConfiguratorCustomSchema.secretName) (not .Values.adminPassword) (or .Release.IsInstall (lookup "v1" "Secret" .Release.Namespace (printf "%s-admin-password" .Release.Name))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin-password
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "janssen-all-in-one.labels" . | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "janssen-all-in-one.adminPassword" . | b64enc }}
{{- end }}
