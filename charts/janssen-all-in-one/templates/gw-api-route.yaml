{{- if index .Values "gateway-api" "enabled" -}}
{{- $fullName := include "janssen-all-in-one.fullname" . -}}
{{- $namespace := .Release.Namespace -}}
{{- $svcName := .Values.service.name -}}
{{- $svcPort := .Values.service.port -}}
{{- $gateway := index .Values "gateway-api" "gateway" -}}
{{- $routes := index .Values "gateway-api" "routes" -}}
{{- $className := $gateway.className -}}
{{- $defaultGatewayName := $gateway.name -}}
{{- $defaultGatewayNamespace := $gateway.gatewayNamespace | default $namespace -}}
{{- $httpSection := $gateway.httpSectionName | default "http" -}}
{{- $httpsSection := $gateway.httpsSectionName | default "https" -}}
{{- /* Per-service Gateway overrides; fall back to the chart's own Gateway when unset. */}}
{{- $authGatewayName := index .Values "auth-server" "gatewayName" | default $defaultGatewayName -}}
{{- $authGatewayNamespace := index .Values "auth-server" "gatewayNamespace" | default $defaultGatewayNamespace -}}
{{- $casaGatewayName := .Values.casa.gatewayName | default $defaultGatewayName -}}
{{- $casaGatewayNamespace := .Values.casa.gatewayNamespace | default $defaultGatewayNamespace -}}
{{- $configApiGatewayName := index .Values "config-api" "gatewayName" | default $defaultGatewayName -}}
{{- $configApiGatewayNamespace := index .Values "config-api" "gatewayNamespace" | default $defaultGatewayNamespace -}}
{{- $fido2GatewayName := .Values.fido2.gatewayName | default $defaultGatewayName -}}
{{- $fido2GatewayNamespace := .Values.fido2.gatewayNamespace | default $defaultGatewayNamespace -}}
{{- $scimGatewayName := .Values.scim.gatewayName | default $defaultGatewayName -}}
{{- $scimGatewayNamespace := .Values.scim.gatewayNamespace | default $defaultGatewayNamespace -}}
{{- /* Endpoint flags fall back to the deprecated <service>.ingress.* flags during the transition. */}}
{{- $authServerEnabled := or $routes.authServerEnabled (index .Values "auth-server" "ingress" "authServerEnabled") -}}
{{- $openidConfigEnabled := or $routes.openidConfigEnabled (index .Values "auth-server" "ingress" "openidConfigEnabled") -}}
{{- $deviceCodeEnabled := or $routes.deviceCodeEnabled (index .Values "auth-server" "ingress" "deviceCodeEnabled") -}}
{{- $firebaseMessagingEnabled := or $routes.firebaseMessagingEnabled (index .Values "auth-server" "ingress" "firebaseMessagingEnabled") -}}
{{- $uma2ConfigEnabled := or $routes.uma2ConfigEnabled (index .Values "auth-server" "ingress" "uma2ConfigEnabled") -}}
{{- $webfingerEnabled := or $routes.webfingerEnabled (index .Values "auth-server" "ingress" "webfingerEnabled") -}}
{{- $authzenConfigEnabled := or $routes.authzenConfigEnabled (index .Values "auth-server" "ingress" "authzenConfigEnabled") -}}
{{- $lockConfigEnabled := or $routes.lockConfigEnabled (index .Values "auth-server" "ingress" "lockConfigEnabled") -}}
{{- $lockAuditEnabled := or $routes.lockAuditEnabled (index .Values "auth-server" "ingress" "lockAuditEnabled") -}}
{{- $casaEnabled := or $routes.casaEnabled .Values.casa.ingress.casaEnabled -}}
{{- $configApiEnabled := or $routes.configApiEnabled (index .Values "config-api" "ingress" "configApiEnabled") -}}
{{- $fido2Enabled := or $routes.fido2Enabled .Values.fido2.ingress.fido2Enabled -}}
{{- $fido2ConfigEnabled := or $routes.fido2ConfigEnabled .Values.fido2.ingress.fido2ConfigEnabled -}}
{{- $fido2WebauthnEnabled := or $routes.fido2WebauthnEnabled .Values.fido2.ingress.fido2WebauthnEnabled -}}
{{- $scimEnabled := or $routes.scimEnabled .Values.scim.ingress.scimEnabled -}}
{{- $scimConfigEnabled := or $routes.scimConfigEnabled .Values.scim.ingress.scimConfigEnabled -}}

{{- /* ======================================================== */}}
{{- /* 1. AUTH SERVER ROUTES                                    */}}
{{- /* ======================================================== */}}

{{- /* Auth Server: Public (HTTP/HTTPS No Redirect) */}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-auth-server-public
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if $routes.labels }}
{{- toYaml $routes.labels | nindent 4 }}
{{- end }}
{{- if $routes.annotations }}
  annotations:
{{- toYaml $routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $authGatewayName }}
    namespace: {{ $authGatewayNamespace }}
    # No sectionName: Attaches to ALL listeners (HTTP and HTTPS)
  hostnames:
  - {{ .Values.fqdn | quote }}
  rules:

  {{- /* 1. OpenID Configuration */}}
  {{- if $openidConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/openid-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/.well-known/openid-configuration
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

  {{- /* 2. Device Code */}}
  {{- if $deviceCodeEnabled }}
  - matches:
    - path:
        type: Exact
        value: /device-code
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/device_authorization.htm
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

  {{- /* 3. Firebase Messaging */}}
  {{- if $firebaseMessagingEnabled }}
  - matches:
    - path:
        type: Exact
        value: /firebase-messaging-sw.js
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/firebase-messaging-sw.js
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

  {{- /* 4. UMA2 Config */}}
  {{- if $uma2ConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/uma2-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/restv1/uma2-configuration
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

  {{- /* 5. Webfinger */}}
  {{- if $webfingerEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/webfinger
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/.well-known/webfinger
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

  {{- /* 6. Lock Config */}}
  {{- if and (index .Values "auth-server" "lockEnabled") ($lockConfigEnabled) }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/lock-server-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/api/v1/configuration
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

  {{- /* 7. Authzen Config */}}
  {{- if $authzenConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/authzen-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /jans-auth/restv1/authzen-configuration
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}
  {{- end }}

{{- /* Auth Server: Secure (HTTPS) and Redirect (HTTP -> HTTPS) */}}
{{- if $authServerEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-auth-server-secure
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if $routes.labels }}
{{- toYaml $routes.labels | nindent 4 }}
{{- end }}
{{- if $routes.annotations }}
  annotations:
{{- toYaml $routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $authGatewayName }}
    namespace: {{ $authGatewayNamespace }}
    sectionName: {{ $httpsSection }}
  hostnames:
  - {{ .Values.fqdn | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /jans-auth
    backendRefs:
    - name: {{ $svcName }}
      port: {{ $svcPort }}

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-auth-server-redirect
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if $routes.labels }}
{{- toYaml $routes.labels | nindent 4 }}
{{- end }}
{{- if $routes.annotations }}
  annotations:
{{- toYaml $routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $authGatewayName }}
    namespace: {{ $authGatewayNamespace }}
    sectionName: {{ $httpSection }}
  hostnames:
  - {{ .Values.fqdn | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /jans-auth
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}

{{- /* Auth Server: gRPC (Lock Server Audit) */}}
{{- if and (index .Values "auth-server" "lockEnabled") ($lockAuditEnabled) }}
---
apiVersion: gateway.networking.k8s.io/v1
{{- if ne $className "nginx" }}
kind: HTTPRoute
{{- else }}
kind: GRPCRoute
{{- end }}
metadata:
  name: {{ $fullName }}-grpc-routes
  namespace: {{ $namespace }}
  labels:
    app: {{ $fullName }}-routes
{{- if $routes.labels }}
{{- toYaml $routes.labels | nindent 4 }}
{{- end }}
{{- if $routes.annotations }}
  annotations:
{{- toYaml $routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ $authGatewayName }}
    namespace: {{ $authGatewayNamespace }}
    sectionName: {{ $httpsSection }}
  hostnames:
  - {{ .Values.fqdn | quote }}
  rules:
  {{- /* DONT use URL rewrite to forward `/io.jans.lock.audit.AuditService` to `/jans-auth/io.jans.lock.audit.AuditService` as AIO image handles it internally */}}
  {{- if ne $className "nginx" }}
  - matches:
    - path:
        type: PathPrefix
        value: /io.jans.lock.audit.AuditService
    backendRefs:
    - name: {{ $svcName }}-grpc
      port: 50051
  {{- else }}
  - matches:
    - method:
        service: io.jans.lock.audit.AuditService
        method: ProcessLog
    - method:
        service: io.jans.lock.audit.AuditService
        method: ProcessBulkLog
    - method:
        service: io.jans.lock.audit.AuditService
        method: ProcessHealth
    - method:
        service: io.jans.lock.audit.AuditService
        method: ProcessBulkHealth
    - method:
        service: io.jans.lock.audit.AuditService
        method: ProcessTelemetry
    - method:
        service: io.jans.lock.audit.AuditService
        method: ProcessBulkTelemetry
    backendRefs:
    - name: {{ $svcName }}-grpc
      port: 50051
  {{- end }}
{{- end }}


