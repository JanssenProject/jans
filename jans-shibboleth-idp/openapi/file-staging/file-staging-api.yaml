openapi: 3.1.0

info:
  title: File Staging API
  description: |
    Out-of-band file-staging service. An external client uploads a file and receives an opaque **token**; a
    store-connected backend then **claims** that token to take ownership, and staging moves the bytes into
    durable storage and returns a durable **handle**. Other APIs reference the token instead of carrying file
    bytes on their own JSON contract. The trust config API is the first consumer — a `FILE` metadata source is
    declared with an upload token, which the config server claims at write time (see
    `docs/openapi_design_spec.md` D8/D17 and the scope stub §5.8).

    This service is deliberately **trust-agnostic** and lives at a neutral base path. It is specified and
    (initially) deployed alongside the trust APIs, sharing their `problem+json` error shape
    (`components/common.yaml`), but is a separate spec and module so it can be promoted to its own deployable
    when a second consumer appears.

    **Two calls, two principals.** `upload` is used by an external client (UI/CLI) that only stages bytes;
    `claim` is used by a store-connected backend that takes ownership. `claim` is a **control-plane** call:
    no file bytes cross HTTP — staging moves the entry within the shared document store to the destination
    path the claimer names (a unix-style path in the store's directory-like structure) and returns the
    durable handle (the resulting path). Consumers then read that handle **directly from the document store**;
    there is no `resolve` (download) endpoint and no consumer-initiated delete — a background cleaner reaps
    staged entries that expire without being claimed.

    **Authorization.** A Jans-issued OAuth2 access token (client-credentials). Two scopes gate every call: a
    coarse **service** scope (`.../files`) and a per-**operation** scope (`.../files.upload` or
    `.../files.claim`), both required. An uploader holds only `files.upload`; a claimer holds only
    `files.claim`. See §5.8: the storage tier enforces no permissions, so this scope check is the only
    enforceable authorization and audit point for files.
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /v1/files
    description: Base path for the file-staging service (neutral, not trust-scoped).

# No global `security:` — the required per-operation scope differs (upload vs claim), so each operation
# declares its own requirement. Every operation requires the coarse service scope PLUS its operation scope
# (a single requirement object listing both = AND).

tags:
  - name: files
    description: Staging (upload) and claiming (take ownership + move to durable storage) of uploaded files.

paths:

  /:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Stage a file
      description: |
        Uploads raw file bytes and returns an opaque `token` plus integrity/lifecycle metadata. The token is
        short-lived (see `expires_at`) and is meant to be claimed promptly. Until claimed, the staged object
        is reaped by the background cleaner once it expires. The transfer encoding is
        `application/octet-stream`; the file's own logical media type may be asserted with the optional
        `content_type` query parameter and is echoed back.
      security:
        - filesOAuth:
            - https://jans.io/shibboleth-idp/files
            - https://jans.io/shibboleth-idp/files.upload
      parameters:
        - name: content_type
          in: query
          required: false
          description: The uploaded file's logical media type (e.g. `application/samlmetadata+xml`). Recorded and echoed in the response.
          schema:
            type: string
            examples: [application/samlmetadata+xml]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: The file was staged. The response body carries the token and metadata.
          headers:
            Location:
              description: URL of the staged file (the `claim` target).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedFileView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /{token}/claim:
    parameters:
      - $ref: '#/components/parameters/TokenPath'
    post:
      tags: [files]
      operationId: claimFile
      summary: Claim a staged file (take ownership + move to durable storage)
      description: |
        Takes ownership of a staged file. Staging **moves** the entry out of the staging area to the
        caller-named `destination` path in the shared document store and returns the durable **handle** — the
        resulting path — which the caller stores and later reads directly from the store. This is a
        control-plane call: **no bytes are returned over HTTP**.

        The move takes the entry out of staging, so a claimed file is no longer subject to the cleaner and
        there is no separate release step. The filename under `destination` is **derived deterministically**
        from the token, so `claim` is **idempotent** per `(token, destination)`: a retry after a partial
        failure yields the same handle. An expired or already-reaped token fails with `409`; an unknown token
        fails with `404`.

        `destination` is validated for namespace hygiene (a well-formed path within the caller's agreed
        layout) — this prevents accidental clobbering, not privilege escalation: the document store's
        directory-like structure enforces no per-path ACLs here (see `docs/openapi_design_spec.md` §5.8).
      security:
        - filesOAuth:
            - https://jans.io/shibboleth-idp/files
            - https://jans.io/shibboleth-idp/files.claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: The file was claimed and moved to durable storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Gone'

components:

  # Problem and Violation are shared — see components/common.yaml (referenced by the responses below).

  securitySchemes:
    filesOAuth:
      type: oauth2
      description: |
        OAuth2 access token from the Janssen authorization server (client-credentials; machine-to-machine).
        The `tokenUrl` below is illustrative — the real endpoint is the deployment's Jans Auth Server token
        endpoint. Each operation requires the coarse `files` scope plus its operation scope.
      flows:
        clientCredentials:
          tokenUrl: https://jans-auth-server.example/jans-auth/restv1/token
          scopes:
            https://jans.io/shibboleth-idp/files: Use the file-staging service (coarse gate; required by every operation).
            https://jans.io/shibboleth-idp/files.upload: Stage a new file.
            https://jans.io/shibboleth-idp/files.claim: Claim a staged file (take ownership; move to durable storage).

  parameters:
    TokenPath:
      name: token
      in: path
      required: true
      description: The opaque token returned by a prior upload.
      schema:
        type: string
        minLength: 1
        examples: [f1a2b3c4-5d6e-7f80-9a1b-2c3d4e5f6a7b]

  responses:

    BadRequest:
      description: The request is malformed — e.g. an empty upload body, or a missing/invalid destination (`required_value_missing`).
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

    Forbidden:
      description: The token is valid but lacks a required scope (`insufficient_scope`).
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

    NotFound:
      description: No staged file exists for the token (`file_not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

    Gone:
      description: The token has expired or its staged file was already reaped/claimed (`file_expired`).
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

    PayloadTooLarge:
      description: The uploaded file exceeds the service's size limit (`file_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

    UnsupportedMediaType:
      description: The asserted `content_type` is not accepted by the service (`unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/Problem'

  schemas:

    StagedFileView:
      type: object
      description: Metadata for a staged (not yet claimed) file — the token plus integrity and lifecycle fields.
      additionalProperties: false
      required: [token, size, sha256, expires_at]
      properties:
        token:
          type: string
          description: Opaque handle for the staged file; used to claim it.
          examples: [f1a2b3c4-5d6e-7f80-9a1b-2c3d4e5f6a7b]
        size:
          type: integer
          format: int64
          description: Size of the staged bytes, in bytes.
          examples: [20480]
        content_type:
          type: string
          description: The file's logical media type as asserted at upload; null/absent if none was given.
          examples: [application/samlmetadata+xml]
        sha256:
          type: string
          description: Hex-encoded SHA-256 of the bytes, so a claimer can verify integrity after reading.
          examples: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]
        expires_at:
          type: string
          format: date-time
          description: When the token expires; after this an unclaimed staged file is eligible for the cleaner.
          examples: ['2026-08-06T12:34:56Z']

    ClaimRequest:
      type: object
      description: Where the claimed file should be moved in the shared document store.
      additionalProperties: false
      required: [destination]
      properties:
        destination:
          type: string
          minLength: 1
          description: |
            Unix-style path locating where the claimed file is stored in the document store's directory-like
            structure — typically the Shibboleth IdP metadata location. Staging places the file under this
            path with a filename derived deterministically from the token (keeping `claim` idempotent) and
            returns the full resulting path as the handle. Validated for namespace hygiene (well-formed path;
            no accidental escape/clobber) — not a security boundary.
          examples: ['/opt/shibboleth-idp/metadata/']

    ClaimResult:
      type: object
      description: The durable handle produced by claiming a staged file.
      additionalProperties: false
      required: [handle, size, sha256]
      properties:
        handle:
          type: string
          description: |
            Durable, caller-owned path locating the moved file in the document store (destination + the
            deterministically-derived filename). The caller stores this (e.g. as a `FileMetadataSource`
            `filePath`) and reads it directly from the document store thereafter.
          examples: ['/opt/shibboleth-idp/metadata/f1a2b3c4-5d6e-7f80-9a1b-2c3d4e5f6a7b.xml']
        size:
          type: integer
          format: int64
          description: Size of the file, in bytes (unchanged by the move).
          examples: [20480]
        content_type:
          type: string
          description: The file's logical media type, carried over from upload; null/absent if none was given.
          examples: [application/samlmetadata+xml]
        sha256:
          type: string
          description: Hex-encoded SHA-256 of the bytes (unchanged by the move), for post-claim integrity verification.
          examples: [9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08]
