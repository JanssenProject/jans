[package]
name = "sigstore-verifier"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = true
description = "Pure Rust, WASM-compatible Sigstore/Cosign blob verification library"
keywords = ["sigstore", "cosign", "verification", "wasm"]
categories = ["cryptography", "wasm"]

[features]
# Exposes `fuzz_api`, thin `pub` wrappers around otherwise `pub(crate)`
# parsers, so the out-of-tree `fuzz/` crate (a separate cargo-fuzz project)
# can reach them. Not for normal use — see fuzz/README.md.
fuzzing = []
# Exposes `testing`, a signer that produces valid bundles under a synthetic
# trust root, so downstream crates can test verification offline. Enable it
# only from `[dev-dependencies]`; `rcgen` (with `ring`) does not build for wasm.
test-support = ["dep:rcgen", "p256/pkcs8", "p384/pkcs8"]

[dependencies]
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Runtime wall-clock check that the embedded static trust root hasn't aged
# past its certificates' validity (build-time checks alone can't catch a
# binary that outlives its own build). Not used anywhere else in the crate —
# all security-relevant time comparisons otherwise use the bundle's own
# Rekor `integratedTime`, not the system clock.
chrono = { workspace = true }

p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
# Fulcio root + intermediate CAs are P-384 (signing leaves with ecdsa-with-SHA384),
# so chain-link signature verification needs P-384. Leaf/Rekor/CTFE keys are P-256.
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
x509-parser = { version = "0.18", default-features = false }
serde_json_canonicalizer = { workspace = true }
regex-lite = { version = "0.1" }
base64 = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
# `pkcs8` is dev-only: bridges an rcgen-generated leaf key into a p256 SigningKey
# for end-to-end tests. Not compiled for the shipped lib or the wasm target.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }
# `pkcs8` is dev-only: bridges an rcgen-generated leaf key into a p384 SigningKey
# for end-to-end tests. Not compiled for the shipped lib or the wasm target.
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }

[build-dependencies]
x509-parser = { version = "0.18", default-features = false }
base64 = { workspace = true }
chrono = { workspace = true }

[[test]]
name = "testing_signer"
required-features = ["test-support"]

[lints]
workspace = true
