# Two trusted issuers bind the same Cedar entity type (Jans::Access_Token) under
# the SAME internal token_metadata key ("access_token"). This is the standard,
# unambiguous multi-issuer configuration and must keep working.
cedar_version: v4.0.0
policy_stores:
  multi_issuer_shared_mapping_same_key_store:
    cedar_version: v4.0.0
    name: MultiIssuerSharedMappingSameKey
    description: Two issuers share one entity type under the same internal token key
    trusted_issuers:
      AlphaIssuer:
        name: "Alpha"
        description: "Alpha Identity Provider"
        openid_configuration_endpoint: "https://idp.alpha.example/.well-known/openid-configuration"
        token_metadata:
          access_token:
            entity_type_name: "Jans::Access_Token"
      BetaIssuer:
        name: "Beta"
        description: "Beta Identity Provider"
        openid_configuration_endpoint: "https://idp.beta.example/.well-known/openid-configuration"
        token_metadata:
          access_token:
            entity_type_name: "Jans::Access_Token"
            required_claims: ["org_id"]
    policies:
      allow_alpha_access_token:
        description: Allow Read when a validated Alpha access token is present
        creation_date: "2026-08-31T10:00:00.000000"
        policy_content:
          encoding: none
          content_type: cedar
          body: |-
            permit(
                principal,
                action == Jans::Action::"Read",
                resource == Jans::Resource::"Docs"
            ) when {
                context has tokens.alpha_access_token
            };
      allow_beta_access_token:
        description: Allow Read when a validated Beta access token is present
        creation_date: "2026-08-31T10:00:00.000000"
        policy_content:
          encoding: none
          content_type: cedar
          body: |-
            permit(
                principal,
                action == Jans::Action::"Read",
                resource == Jans::Resource::"Docs"
            ) when {
                context has tokens.beta_access_token
            };
    schema:
      encoding: none
      content_type: cedar
      body: |-
        namespace Alpha {
          entity TrustedIssuer = {"issuer_entity_id": Jans::Url};
        }

        namespace Beta {
          entity TrustedIssuer = {"issuer_entity_id": Jans::Url};
        }

        namespace Jans {
          type Url = {"host": String, "path": String, "protocol": String};
          entity Access_Token = {
            token_type: String,
            jti: String,
            validated_at: Long,
            exp: Long,
            sub?: String,
            org_id?: String,
          } tags Set<String>;
          entity Resource = {"name": String};
          entity Any;
          action "Read" appliesTo {
            principal: [Any],
            resource: [Resource],
            context: Context
          };
        }

        type Context = {
          tokens: {
            alpha_access_token?: Jans::Access_Token,
            beta_access_token?: Jans::Access_Token,
            total_token_count: Long
          }
        };
