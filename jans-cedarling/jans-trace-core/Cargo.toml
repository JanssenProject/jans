[package]
name = "jans-trace-core"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Deterministic TRACE cryptography: strict JSON, RFC 8785 JCS, Ed25519, SHA-256 digests"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true, features = ["std"] }
ed25519-dalek = { workspace = true, features = ["pem"] }

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
