[package]
name = "jans_trace_uniffi"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "UniFFI bindings of jans-trace-core for the JVM"

[lib]
crate-type = ["cdylib"]
name = "jans_trace_uniffi"

[dependencies]
jans-trace-core = { path = "../../jans-trace-core" }
thiserror = { workspace = true }
uniffi = { version = "0.32.1", features = ["cli"] }
zeroize = "1.9.0"

[lints]
workspace = true
