cedar_version: 4.5.0
policy_stores:
  abc123def456:
    name: JavaScript services example
    trusted_issuers:
      Acme:
        name: Acme
        description: Synthetic example issuer
        openid_configuration_endpoint: https://acme.example.invalid/.well-known/openid-configuration
        token_metadata:
          access_token:
            entity_type_name: Acme::Access_Token
      Dolphin:
        name: Dolphin
        description: Synthetic example issuer
        openid_configuration_endpoint: https://dolphin.example.invalid/.well-known/openid-configuration
        token_metadata:
          access_token:
            entity_type_name: Dolphin::Access_Token
    policies:
      allow-alice:
        policy_content:
          body: |
            @description("Allows Alice to read document-1")
            permit(principal, action, resource)
            when {
              if action == Example::Action::"Read"
              then principal == Example::User::"alice" && resource == Example::Document::"document-1"
              else false
            };
      matching-organizations:
        policy_content:
          body: |
            @description("Requires matching organization claims from both issuers")
            permit(principal, action == MultiIssuer::Action::"Read", resource)
            when {
              context has tokens &&
              context.tokens has acme_access_token &&
              context.tokens has dolphin_access_token &&
              context.tokens.acme_access_token.hasTag("org_id") &&
              context.tokens.dolphin_access_token.hasTag("org_id") &&
              context.tokens.acme_access_token.getTag("org_id").contains(resource.org_id) &&
              context.tokens.dolphin_access_token.getTag("org_id").contains(resource.org_id)
            };
    schema:
      body: |
        namespace Example {
          entity User;
          entity Document;
          action "Read" appliesTo {
            principal: [User],
            resource: [Document],
            context: {}
          };
        }
        namespace Acme {
          entity TrustedIssuer = { issuer_entity_id: MultiIssuer::Url };
          entity Access_Token = {
            token_type: String, jti: String, iss: TrustedIssuer,
            validated_at: Long, exp: Long, sub?: String, org_id?: String
          } tags Set<String>;
        }
        namespace Dolphin {
          entity TrustedIssuer = { issuer_entity_id: MultiIssuer::Url };
          entity Access_Token = {
            token_type: String, jti: String, iss: TrustedIssuer,
            validated_at: Long, exp: Long, sub?: String, org_id?: String
          } tags Set<String>;
        }
        namespace MultiIssuer {
          type Url = { host: String, path: String, protocol: String };
          entity Any;
          entity Resource = { org_id: String };
          action "Read" appliesTo {
            principal: [Any], resource: [Resource], context: Context
          };
        }
        type Context = {
          tokens: {
            acme_access_token?: Acme::Access_Token,
            dolphin_access_token?: Dolphin::Access_Token,
            total_token_count: Long
          }
        };
