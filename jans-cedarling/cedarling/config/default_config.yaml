CEDARLING_APPLICATION_NAME: My App
CEDARLING_POLICY_STORE_URI: ""
CEDARLING_LOG_TYPE: "memory"
CEDARLING_LOG_LEVEL: "DEBUG"
CEDARLING_LOG_TTL: 60
CEDARLING_LOCAL_JWKS: null
CEDARLING_POLICY_STORE_LOCAL: null
CEDARLING_POLICY_STORE_LOCAL_FN: "../config/policy-store.cjar"
# Cap on the decompressed size of a single .cjar entry.
CEDARLING_POLICY_STORE_MAX_FILE_SIZE: 10485760
# Verify the .cjar Sigstore bundle: "disabled" or "enforce".
CEDARLING_POLICY_STORE_SIGSTORE_MODE: "disabled"
CEDARLING_JWT_SIG_VALIDATION: "enabled"
CEDARLING_JWT_STATUS_VALIDATION: "enabled"
CEDARLING_STRICT_SCHEMA_VALIDATION: "enabled"
CEDARLING_CUSTOM_TOKEN_PROCESSOR_TIMEOUT_MILLIS: 0
CEDARLING_METRICS_COLLECTION: "disabled"
CEDARLING_JWT_STATUS_LIST_REFRESH_INTERVAL_MAX: 300
CEDARLING_TOKEN_CACHE_MAX_TTL: 5
CEDARLING_JWT_SIGNATURE_ALGORITHMS_SUPPORTED:
  - "HS256"
  - "RS256"
CEDARLING_LOCK: "disabled"
CEDARLING_LOCK_SERVER_CONFIGURATION_URI: null
CEDARLING_LOCK_DYNAMIC_CONFIGURATION: "disabled"
CEDARLING_LOCK_HEALTH_INTERVAL: 0
CEDARLING_LOCK_TELEMETRY_INTERVAL: 0
CEDARLING_LOCK_LISTEN_SSE: "disabled"
# Sign AUTHORIZATION_DECISION TRACE records and send them to Lock Server.
# Requires CEDARLING_LOCK: "enabled", a .cjar policy store and a signing key.
CEDARLING_TRACE: "disabled"
# Defaults to CEDARLING_APPLICATION_NAME; must match ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,254}$.
# CEDARLING_TRACE_PRODUCER_ID: null
# Path to an unencrypted PKCS#8 PEM Ed25519 private key. TRACE needs this or
# CEDARLING_TRACE_SIGNING_KEY_PEM; the path wins when both are set.
# CEDARLING_TRACE_SIGNING_KEY: null
# The same key as inline PEM text.
# CEDARLING_TRACE_SIGNING_KEY_PEM: null
# Defaults to the key thumbprint (sha256:<hex>).
# CEDARLING_TRACE_SIGNING_KID: null
# "discovered" takes trace_bulk_endpoint from the Lock Server well-known configuration.
# CEDARLING_TRACE_ENDPOINT: "discovered"
# CEDARLING_TRACE_BULK_MAX_RECORDS: 100
# CEDARLING_TRACE_BULK_MAX_BYTES: 4194304
CEDARLING_MAX_DEFAULT_ENTITIES: 1000
CEDARLING_MAX_BASE64_SIZE: 1048576
